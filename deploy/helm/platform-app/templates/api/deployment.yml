apiVersion: apps/v1
kind: Deployment
metadata:
  name: api

spec:
  replicas: {{ .Values.api.replicaCount }}

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      annotations:
        checksum/config: {{ toJson .Values.api.env | sha256sum }}
      labels:
        app: api
{{ if .Values.keyVault.enabled }}
        azure.workload.identity/use: "true"
{{ end }}

    spec:
{{ if .Values.keyVault.enabled }}
      serviceAccountName: {{ .Values.keyVault.serviceAccountName }}
{{ end }}
      containers:
        - name: api

          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"

          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: platform-app-config

            - secretRef:
                name: {{ .Values.secrets.existingSecret }}

{{ if .Values.keyVault.enabled }}
          # This explicit variable takes precedence over any DATABASE_URL that
          # may still be present in the legacy application secret.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keyVault.kubernetesSecretName }}
                  key: DATABASE_URL

          volumeMounts:
            # Mounting triggers the CSI driver to sync the Key Vault value.
            - name: keyvault-secrets
              mountPath: /mnt/keyvault
              readOnly: true
{{ end }}

          startupProbe:
            httpGet:
              path: /health
              port: 8000

            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            periodSeconds: 30
            timeoutSeconds: 5

{{ if .Values.keyVault.enabled }}
      volumes:
        - name: keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.keyVault.secretProviderClassName }}
{{ end }}

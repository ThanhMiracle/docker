{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.keyVault.secretProviderClassName }}
spec:
  provider: azure
  # Sync the Key Vault value as a separate Kubernetes Secret. Keeping it
  # separate prevents the CSI driver from managing unrelated app secrets.
  secretObjects:
    - secretName: {{ .Values.keyVault.kubernetesSecretName }}
      type: Opaque
      data:
        - objectName: {{ .Values.keyVault.databaseUrlSecretName }}
          key: DATABASE_URL
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "keyVault.clientId is required when keyVault.enabled is true" .Values.keyVault.clientId | quote }}
    keyvaultName: {{ required "keyVault.name is required when keyVault.enabled is true" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required when keyVault.enabled is true" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.databaseUrlSecretName }}
          objectType: secret
          objectVersion: ""
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      annotations:
        checksum/config: {{ toJson .Values.frontend.env | sha256sum }}
        {{- with .Values.release.commit }}
        devops.platform/commit: {{ . | quote }}
        {{- end }}
        {{- with .Values.release.prNumber }}
        devops.platform/pr-number: {{ . | quote }}
        {{- end }}
        {{- with .Values.release.workflowRunId }}
        devops.platform/workflow-run-id: {{ . | quote }}
        {{- end }}
        {{- with .Values.release.deploymentRunId }}
        devops.platform/deployment-run-id: {{ . | quote }}
        {{- end }}
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: {{ include "platform-app.image" (dict "name" "frontend" "image" .Values.frontend.image) | quote }}

          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:
            - containerPort: 8080

          env:
            - name: API_BASE
              valueFrom:
                configMapKeyRef:
                  name: platform-app-config
                  key: API_BASE

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

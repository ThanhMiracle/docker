apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx

spec:
  replicas: {{ .Values.nginx.replicaCount }}

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      annotations:
        checksum/config: {{ .Files.Get "files/nginx.conf" | sha256sum }}
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx

          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

          readinessProbe:
            httpGet:
              path: /health
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 30

      volumes:
        - name: nginx-config

          configMap:
            name: nginx-config

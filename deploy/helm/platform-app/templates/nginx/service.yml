apiVersion: v1
kind: Service

metadata:
  name: nginx
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"

spec:
  type: {{ .Values.nginx.service.type }}

  selector:
    app: nginx

  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: 8080
      protocol: TCP
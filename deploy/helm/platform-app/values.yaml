frontend:
  replicaCount: 1

  image:
    repository: thanh2909/my-fe
    tag: latest
    pullPolicy: IfNotPresent

  service:
    port: 80

  env:
    API_BASE: "/api"


api:
  replicaCount: 1

  image:
    repository: thanh2909/my-api
    tag: latest
    pullPolicy: IfNotPresent

  service:
    port: 8000

  env:
    JWT_EXPIRE_MINUTES: "60"
    CORS_ORIGINS: "*"

    LOGIN_RATE_LIMIT: "5"
    LOGIN_RATE_WINDOW_SECONDS: "60"

    SMTP_PORT: "587"
    SMTP_USE_TLS: "true"

    STORAGE_BACKEND: "minio"

    MINIO_BUCKET: "uploads"
    MINIO_PUBLIC_URL: "/storage/uploads"
    MINIO_ENDPOINT_URL: "http://minio:9000"
    MINIO_AUTO_CREATE_BUCKET: "true"


nginx:
  replicaCount: 1

  image:
    repository: nginx
    tag: alpine

  service:
    type: LoadBalancer
    port: 80


minio:
  image:
    repository: quay.io/minio/minio
    tag: latest

  service:
    apiPort: 9000
    consolePort: 9001

  persistence:
    size: 10Gi
    # AKS built-in Blob CSI class. It creates and mounts an Azure Blob
    # container with BlobFuse for MinIO's /data directory.
    storageClass: azureblob-fuse-premium
    accessModes:
      - ReadWriteMany


healthMonitor:
  enabled: true

  image:
    repository: curlimages/curl
    tag: "8.10.1"

  intervalSeconds: "60"


secrets:
  existingSecret: platform-app-secrets

# Azure Key Vault integration for DATABASE_URL. Set enabled to true only after
# the AKS Key Vault CSI driver and Workload Identity have been configured.
keyVault:
  enabled: false
  name: ""
  tenantId: ""
  clientId: ""
  databaseUrlSecretName: database-url
  secretProviderClassName: platform-api-keyvault
  kubernetesSecretName: platform-app-db
  serviceAccountName: platform-api-keyvault

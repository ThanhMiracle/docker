# Copy to a private values file. Do not commit real values or database URLs.
keyVault:
  enabled: true
  name: your-key-vault-name
  tenantId: 00000000-0000-0000-0000-000000000000
  clientId: 00000000-0000-0000-0000-000000000000
  databaseUrlSecretName: database-url

# MinIO is a single-replica StatefulSet. Use an AKS managed-disk CSI class
# available on the target cluster.
minio:
  persistence:
    storageClass: managed-csi
    accessModes:
      - ReadWriteOnce

name: Build and Deploy to AKS

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: myregistry
  ACR_LOGIN_SERVER: myregistry.azurecr.io

  AKS_RESOURCE_GROUP: rg-platform-dev
  AKS_CLUSTER_NAME: aks-platform-dev

  K8S_NAMESPACE: platform

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  build-and-deploy:
    needs: security-scan
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      # -----------------------------------
      # Azure Authentication
      # -----------------------------------

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # -----------------------------------
      # Login ACR
      # -----------------------------------

      - name: Login to ACR
        run: |
          az acr login --name "${ACR_NAME}"


      # -----------------------------------
      # Docker Buildx
      # -----------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # -----------------------------------
      # Frontend
      # -----------------------------------

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}


      # -----------------------------------
      # API
      # -----------------------------------

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/api:${{ github.sha }}


      # -----------------------------------
      # AKS Authentication
      # -----------------------------------

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1.3


      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          admin: "false"
          use-kubelogin: "true"


      # -----------------------------------
      # Namespace
      # -----------------------------------

      - name: Create namespace
        run: |
          kubectl create namespace "${K8S_NAMESPACE}" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -


      # -----------------------------------
      # Application Secrets
      # -----------------------------------

      - name: Create application secrets
        run: |
          kubectl create secret generic platform-app-secrets \
            --namespace "${K8S_NAMESPACE}" \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --from-literal=ADMIN_EMAIL="${ADMIN_EMAIL}" \
            --from-literal=FRONTEND_BASE_URL="${FRONTEND_BASE_URL}" \
            --from-literal=SMTP_HOST="${SMTP_HOST}" \
            --from-literal=SMTP_USERNAME="${SMTP_USERNAME}" \
            --from-literal=SMTP_PASSWORD="${SMTP_PASSWORD}" \
            --from-literal=SMTP_FROM="${SMTP_FROM}" \
            --from-literal=MINIO_ROOT_USER="${MINIO_ROOT_USER}" \
            --from-literal=MINIO_ROOT_PASSWORD="${MINIO_ROOT_PASSWORD}" \
            --from-literal=MINIO_ACCESS_KEY="${MINIO_ROOT_USER}" \
            --from-literal=MINIO_SECRET_KEY="${MINIO_ROOT_PASSWORD}" \
            --from-literal=ALERT_WEBHOOK_URL="${ALERT_WEBHOOK_URL}" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}

          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}

          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}


      # -----------------------------------
      # Helm deploy
      # -----------------------------------

      - name: Deploy with Helm
        run: |
          helm upgrade --install platform-app \
            ./deploy/helm/platform-app \
            --namespace "${K8S_NAMESPACE}" \
            --set frontend.image.repository="${ACR_LOGIN_SERVER}/frontend" \
            --set frontend.image.tag="${GITHUB_SHA}" \
            --set api.image.repository="${ACR_LOGIN_SERVER}/api" \
            --set api.image.tag="${GITHUB_SHA}" \
            --wait \
            --timeout 10m


      # -----------------------------------
      # Verify deployment
      # -----------------------------------

      - name: Verify
        run: |
          kubectl get pods \
            --namespace "${K8S_NAMESPACE}"

          kubectl get services \
            --namespace "${K8S_NAMESPACE}"

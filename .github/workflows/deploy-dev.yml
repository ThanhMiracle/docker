name: Build and deploy to AKS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Prevent overlapping runs from deploying an older image after a newer commit.
concurrency:
  group: platform-aks-deploy
  cancel-in-progress: false

# Configure ACR_NAME, Azure identity IDs, and K8S_NAMESPACE as repository
# variables. Store application settings as repository/environment secrets.
env:
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'platform' }}
  HELM_RELEASE: platform-app
  IMAGE_TAG: v0.${{ github.run_number }}

jobs:
  validate-chart:
    name: Validate Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Lint default chart
        run: helm lint ./deploy/helm/platform-app

      - name: Lint Key Vault chart configuration
        run: >-
          helm lint ./deploy/helm/platform-app
          --values ./deploy/helm/platform-app/values-keyvault.example.yml

      - name: Render deployment manifests
        run: >-
          helm template platform-app ./deploy/helm/platform-app
          --namespace "${{ vars.K8S_NAMESPACE || 'platform' }}"
          --values ./deploy/helm/platform-app/values-keyvault.example.yml

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend test image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: platform-api-test:${{ github.sha }}

      - name: Run backend tests
        run: >-
          docker run --rm
          -e DATABASE_URL=sqlite:////tmp/test.db
          -e ADMIN_EMAIL=alice@example.com
          platform-api-test:${{ github.sha }}

  test-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

  build-and-push:
    name: Build and push images
    needs: [validate-chart, security-scan, test-backend, test-frontend]
    runs-on: ubuntu-latest

    outputs:
      frontend-image: ${{ steps.images.outputs.frontend-image }}
      api-image: ${{ steps.images.outputs.api-image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify image configuration
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$ACR_NAME"
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Set image names
        id: images
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          # Azure public-cloud registries use this stable login-server format.
          # Avoiding an ARM lookup means the CI identity only needs AcrPush.
          acr_login_server="${ACR_NAME}.azurecr.io"
          echo "frontend-image=${acr_login_server}/my-fe" >> "$GITHUB_OUTPUT"
          echo "api-image=${acr_login_server}/my-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.images.outputs.frontend-image }}:${{ env.IMAGE_TAG }}

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.images.outputs.api-image }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to AKS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # KUBECONFIG_B64 is the base64-encoded contents of the kubeconfig file.
      - name: Configure Kubernetes access
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # This only installs kubelogin. It is harmless for certificate/token-based
      # kubeconfigs and is required when the kubeconfig invokes kubelogin.
      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.19

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Verify cluster access
        run: kubectl version --request-timeout=30s

      - name: Verify AKS storage and Key Vault integrations
        run: |
          kubectl get storageclass azureblob-fuse-premium
          kubectl get crd secretproviderclasses.secrets-store.csi.x-k8s.io

      - name: Create namespace
        run: |
          kubectl create namespace "$K8S_NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
      - name: Validate required secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          API_KEYVAULT_CLIENT_ID: ${{ vars.API_KEYVAULT_CLIENT_ID }}
        run: |
          failed=0

          for name in \
            JWT_SECRET \
            ADMIN_EMAIL \
            SMTP_HOST \
            SMTP_USERNAME \
            SMTP_PASSWORD \
            SMTP_FROM \
            MINIO_ROOT_USER \
            MINIO_ROOT_PASSWORD \
            KEY_VAULT_NAME \
            AZURE_TENANT_ID \
            API_KEYVAULT_CLIENT_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing or empty"
              failed=1
            fi
          done

          exit "$failed"

      - name: Apply application secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          kubectl create secret generic platform-app-secrets \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ADMIN_EMAIL="$ADMIN_EMAIL" \
            --from-literal=SMTP_HOST="$SMTP_HOST" \
            --from-literal=SMTP_USERNAME="$SMTP_USERNAME" \
            --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
            --from-literal=SMTP_FROM="$SMTP_FROM" \
            --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            --from-literal=MINIO_ACCESS_KEY="$MINIO_ROOT_USER" \
            --from-literal=MINIO_SECRET_KEY="$MINIO_ROOT_PASSWORD" \
            --from-literal=ALERT_WEBHOOK_URL="$ALERT_WEBHOOK_URL" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        env:
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend-image }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api-image }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          API_KEYVAULT_CLIENT_ID: ${{ vars.API_KEYVAULT_CLIENT_ID }}
        run: |
          helm upgrade --install "$HELM_RELEASE" ./deploy/helm/platform-app \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --set-string frontend.image.repository="$FRONTEND_IMAGE" \
            --set-string frontend.image.tag="$IMAGE_TAG" \
            --set-string api.image.repository="$API_IMAGE" \
            --set-string api.image.tag="$IMAGE_TAG" \
            --set keyVault.enabled=true \
            --set-string keyVault.name="$KEY_VAULT_NAME" \
            --set-string keyVault.tenantId="$AZURE_TENANT_ID" \
            --set-string keyVault.clientId="$API_KEYVAULT_CLIENT_ID" \
            --wait \
            --atomic \
            --debug \
            --timeout 10m

      # Helm creates Services before Deployments. Once AKS allocates the
      # LoadBalancer address, add it to the app secret and restart only the
      # API so new email links use the public frontend URL.
      - name: Configure frontend URL from Nginx LoadBalancer
        run: |
          frontend_host=""

          for attempt in $(seq 1 60); do
            frontend_host=$(kubectl get service nginx --namespace "$K8S_NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -z "$frontend_host" ]; then
              frontend_host=$(kubectl get service nginx --namespace "$K8S_NAMESPACE" \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            fi

            if [ -n "$frontend_host" ]; then
              break
            fi

            echo "Waiting for the Nginx LoadBalancer address ($attempt/60)..."
            sleep 5
          done

          test -n "$frontend_host"
          frontend_base_url="http://${frontend_host}"
          frontend_base_url_b64=$(printf '%s' "$frontend_base_url" | base64 --wrap=0)

          kubectl patch secret platform-app-secrets --namespace "$K8S_NAMESPACE" \
            --type merge \
            --patch "{\"data\":{\"FRONTEND_BASE_URL\":\"${frontend_base_url_b64}\"}}"

          kubectl rollout restart deployment/api --namespace "$K8S_NAMESPACE"
          kubectl rollout status deployment/api --namespace "$K8S_NAMESPACE" --timeout=5m
          echo "Frontend URL configured as ${frontend_base_url}"

      - name: Show deployed resources
        if: always()
        run: |
          kubectl get deployments,statefulsets,pods,services --namespace "$K8S_NAMESPACE"

      - name: Show failure diagnostics
        if: failure()
        run: |
          kubectl get pods --namespace "$K8S_NAMESPACE" -o wide
          kubectl get events --namespace "$K8S_NAMESPACE" --sort-by=.lastTimestamp

name: Build Release

on:
  push:
    branches: [main]

# Default workflow permissions stay minimal.
permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  ACR_NAME: ${{ secrets.ACR_NAME || vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER || vars.ACR_LOGIN_SERVER }}
  API_IMAGE_NAME: my-api
  FRONTEND_IMAGE_NAME: my-fe
  NGINX_IMAGE_NAME: my-nginx

  # Include run_attempt so a rerun does not overwrite the previous tag.
  RELEASE_TAG: v${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  # ============================================================
  # 1. Validate source and run quality gates
  # ============================================================
  quality-gate:
    name: Application validation
    uses: ./.github/workflows/pr-ci.yml

  validate-source:
    name: Require a merged Pull Request
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.trace.outputs.pr_number }}
    steps:
      - name: Bind release commit to its merged PR
        id: trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          pr="$(jq -er --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            [.[] | select(.merged_at != null and .base.ref == "main"
              and .base.repo.full_name == $repo and .merge_commit_sha == $sha)]
            | first | .number // empty' <<< "$prs")" || {
            echo "::error::Release requires a PR merged into main."
            exit 1
          }
          printf 'pr_number=%s\n' "$pr" >> "$GITHUB_OUTPUT"

  # ============================================================
  # 2. Build, validate, scan, and publish release artifacts
  # ============================================================
  build-release:
    name: Build, scan, and publish immutable artifacts
    needs: [quality-gate, validate-source]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6

      - name: Validate registry configuration
        run: |
          set -euo pipefail
          test -n "$ACR_NAME"
          test -n "$ACR_LOGIN_SERVER"
          test "$ACR_LOGIN_SERVER" = "$ACR_NAME.azurecr.io"

      - name: Sign in to Azure with the build OIDC identity
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_BUILD_CLIENT_ID || vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build release images once
        run: |
          set -euo pipefail

          # Dockerfile's final stage is test; production must use runtime.
          docker build \
            --file backend/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --target runtime \
            --tag "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$RELEASE_TAG" \
            backend

          docker build \
            --file frontend/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:$RELEASE_TAG" \
            frontend

          docker build \
            --file nginx/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME:$RELEASE_TAG" \
            nginx

      # This catches runtime dependency mistakes such as:
      # ModuleNotFoundError: No module named 'psycopg'
      - name: Validate API runtime dependencies
        run: |
          set -euo pipefail

          docker run --rm \
            --entrypoint python \
            "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$RELEASE_TAG" \
            -c "import fastapi, sqlalchemy, psycopg; print('API runtime dependencies OK')"

      - name: Scan API release image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          format: json
          output: api-image-security.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Scan frontend release image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          format: json
          output: frontend-image-security.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          skip-setup-trivy: true

      - name: Scan Nginx release image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.NGINX_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          format: json
          output: nginx-image-security.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          skip-setup-trivy: true

      - name: Generate SBOMs from the scanned images
        run: |
          set -euo pipefail
          mkdir -p release
          for image in "$API_IMAGE_NAME" "$FRONTEND_IMAGE_NAME" "$NGINX_IMAGE_NAME"; do
            trivy image --scanners secret --exit-code 1 --format json \
              --output "$image-image-secrets.json" "$ACR_LOGIN_SERVER/$image:$RELEASE_TAG"
          done
          trivy image --format cyclonedx --output release/api.sbom.cdx.json "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$RELEASE_TAG"
          trivy image --format cyclonedx --output release/frontend.sbom.cdx.json "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:$RELEASE_TAG"
          trivy image --format cyclonedx --output release/nginx.sbom.cdx.json "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME:$RELEASE_TAG"
          cp *-image-security.json *-image-secrets.json release/

      - name: Push images after all quality gates pass
        run: |
          set -euo pipefail

          docker push "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$RELEASE_TAG"
          docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:$RELEASE_TAG"
          docker push "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME:$RELEASE_TAG"

      - name: Resolve immutable ACR digests
        id: digests
        run: |
          set -euo pipefail

          api_digest="$(
            az acr repository show \
              --name "$ACR_NAME" \
              --image "$API_IMAGE_NAME:$RELEASE_TAG" \
              --query digest \
              --output tsv
          )"

          frontend_digest="$(
            az acr repository show \
              --name "$ACR_NAME" \
              --image "$FRONTEND_IMAGE_NAME:$RELEASE_TAG" \
              --query digest \
              --output tsv
          )"

          nginx_digest="$(
            az acr repository show \
              --name "$ACR_NAME" \
              --image "$NGINX_IMAGE_NAME:$RELEASE_TAG" \
              --query digest \
              --output tsv
          )"

          for digest in "$api_digest" "$frontend_digest" "$nginx_digest"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done

          printf 'api_digest=%s\n' "$api_digest" >> "$GITHUB_OUTPUT"
          printf 'frontend_digest=%s\n' "$frontend_digest" >> "$GITHUB_OUTPUT"
          printf 'nginx_digest=%s\n' "$nginx_digest" >> "$GITHUB_OUTPUT"

      - name: Attest api build provenance
        id: attest-api
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.api_digest }}
          push-to-registry: true

      - name: Attest frontend build provenance
        id: attest-frontend
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.frontend_digest }}
          push-to-registry: true

      - name: Attest nginx build provenance
        id: attest-nginx
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.ACR_LOGIN_SERVER }}/${{ env.NGINX_IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.nginx_digest }}
          push-to-registry: true

      - name: Preserve signed provenance bundles
        env:
          API_BUNDLE: ${{ steps.attest-api.outputs.bundle-path }}
          FRONTEND_BUNDLE: ${{ steps.attest-frontend.outputs.bundle-path }}
          NGINX_BUNDLE: ${{ steps.attest-nginx.outputs.bundle-path }}
        run: |
          cp "$API_BUNDLE" release/api.provenance.sigstore.json
          cp "$FRONTEND_BUNDLE" release/frontend.provenance.sigstore.json
          cp "$NGINX_BUNDLE" release/nginx.provenance.sigstore.json

      - name: Create immutable release manifest
        env:
          PR_NUMBER: ${{ needs.validate-source.outputs.pr_number }}
        run: |
          set -euo pipefail

          mkdir -p release

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg pr_number "$PR_NUMBER" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg image_tag "$RELEASE_TAG" \
            --arg created_at "$(date --utc +%FT%TZ)" \
            --arg api_repository "$ACR_LOGIN_SERVER/$API_IMAGE_NAME" \
            --arg api_digest "${{ steps.digests.outputs.api_digest }}" \
            --arg frontend_repository "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME" \
            --arg frontend_digest "${{ steps.digests.outputs.frontend_digest }}" \
            --arg nginx_repository "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME" \
            --arg nginx_digest "${{ steps.digests.outputs.nginx_digest }}" \
            '{
              schema_version: 1,
              commit: $commit,
              pull_request: $pr_number,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              created_at: $created_at,
              source_repository: env.GITHUB_REPOSITORY,
              workflow_url: (env.GITHUB_SERVER_URL + "/" + env.GITHUB_REPOSITORY + "/actions/runs/" + $run_id),
              evidence: {
                sboms: ["api.sbom.cdx.json", "frontend.sbom.cdx.json", "nginx.sbom.cdx.json"],
                provenance: ["api.provenance.sigstore.json", "frontend.provenance.sigstore.json", "nginx.provenance.sigstore.json"],
                image_scans: ["api-image-security.json", "frontend-image-security.json", "nginx-image-security.json"]
              },
              images: {
                api: {
                  repository: $api_repository,
                  tag: $image_tag,
                  digest: $api_digest
                },
                frontend: {
                  repository: $frontend_repository,
                  tag: $image_tag,
                  digest: $frontend_digest
                },
                nginx: {
                  repository: $nginx_repository,
                  tag: $image_tag,
                  digest: $nginx_digest
                }
              }
            }' > release/release-manifest.json

          (
            cd release
            sha256sum *.json > checksums.txt
          )

      - name: Publish release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Publish build summary
        run: |
          {
            echo "## Build Release complete"
            echo
            echo "- Pull Request: #${{ needs.validate-source.outputs.pr_number }}"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- API digest: \`${{ steps.digests.outputs.api_digest }}\`"
            echo "- Frontend digest: \`${{ steps.digests.outputs.frontend_digest }}\`"
            echo "- Nginx digest: \`${{ steps.digests.outputs.nginx_digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve image scan diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-release-security-evidence
          path: '*-image-*.json'
          if-no-files-found: warn
          retention-days: 90

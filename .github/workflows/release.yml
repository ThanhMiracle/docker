name: Build Release

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  API_IMAGE_NAME: my-api
  FRONTEND_IMAGE_NAME: my-fe
  NGINX_IMAGE_NAME: my-nginx

jobs:
  quality-gate:
    name: Validate merged source
    runs-on: ubuntu-latest
    outputs:
      jira_key: ${{ steps.trace.outputs.jira_key }}
      pr_number: ${{ steps.trace.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # - name: Resolve merged PR and Jira change
      #   id: trace
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh api \
      #       --header "Accept: application/vnd.github+json" \
      #       "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > "$RUNNER_TEMP/pulls.json"

      #     pr_number="$(jq -r '[.[] | select(.base.ref == "master")] | first | .number // empty' "$RUNNER_TEMP/pulls.json")"
      #     head_ref="$(jq -r '[.[] | select(.base.ref == "master")] | first | .head.ref // empty' "$RUNNER_TEMP/pulls.json")"
      #     pr_title="$(jq -r '[.[] | select(.base.ref == "master")] | first | .title // empty' "$RUNNER_TEMP/pulls.json")"
      #     jira_key="$(printf '%s\n%s\n' "$head_ref" "$pr_title" | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | head -n1 || true)"

      #     test -n "$pr_number" || {
      #       echo "::error::The master commit is not associated with a merged pull request."
      #       exit 1
      #     }
      #     test -n "$jira_key" || {
      #       echo "::error::No Jira key was found in the PR branch or title."
      #       exit 1
      #     }

      #     printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"
      #     printf 'jira_key=%s\n' "$jira_key" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build backend test image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: platform-api-test:${{ github.sha }}
      - name: Run backend tests
        run: >-
          docker run --rm
          -e DATABASE_URL=sqlite:////tmp/platform-app-test.db
          -e ADMIN_EMAIL=ci-admin@example.invalid
          platform-api-test:${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run backend SAST
        run: |
          python -m pip install --disable-pip-version-check bandit==1.8.6
          bandit --recursive backend/app --severity-level medium --confidence-level medium
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan source, dependencies, and IaC
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Render production manifests
        run: |
          digest="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          helm lint ./deploy/helm/platform-app --values ./deploy/helm/platform-app/values-dev.yml
          helm template platform-app ./deploy/helm/platform-app \
            --namespace platform \
            --set-string api.image.digest="$digest" \
            --set-string frontend.image.digest="$digest" \
            --set-string nginx.image.digest="$digest" > rendered-manifests.yaml
      - name: Install Conftest
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz \
            | tar --extract --gzip --directory /usr/local/bin conftest
      - name: Enforce immutable-image policy
        run: conftest test --policy policy rendered-manifests.yaml

  build-release:
    name: Build, scan, and publish immutable artifacts
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate registry configuration
        run: |
          test -n "$ACR_NAME"
          test -n "$ACR_LOGIN_SERVER"
          test "$ACR_LOGIN_SERVER" = "$ACR_NAME.azurecr.io"
      - name: Sign in to Azure with the build OIDC identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"
      - name: Build release images once
        run: |
          docker build --file backend/Dockerfile --tag "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$GITHUB_SHA" backend
          docker build --file frontend/Dockerfile --tag "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:$GITHUB_SHA" frontend
          docker build --file nginx/Dockerfile --tag "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME:$GITHUB_SHA" nginx
      - name: Scan API release image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan frontend release image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan Nginx release image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Push images after all quality gates pass
        run: |
          docker push "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$GITHUB_SHA"
          docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:$GITHUB_SHA"
          docker push "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME:$GITHUB_SHA"
      - name: Resolve immutable ACR digests
        id: digests
        run: |
          api_digest="$(az acr repository show --name "$ACR_NAME" --image "$API_IMAGE_NAME:$GITHUB_SHA" --query digest --output tsv)"
          frontend_digest="$(az acr repository show --name "$ACR_NAME" --image "$FRONTEND_IMAGE_NAME:$GITHUB_SHA" --query digest --output tsv)"
          nginx_digest="$(az acr repository show --name "$ACR_NAME" --image "$NGINX_IMAGE_NAME:$GITHUB_SHA" --query digest --output tsv)"
          for digest in "$api_digest" "$frontend_digest" "$nginx_digest"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done
          printf 'api_digest=%s\n' "$api_digest" >> "$GITHUB_OUTPUT"
          printf 'frontend_digest=%s\n' "$frontend_digest" >> "$GITHUB_OUTPUT"
          printf 'nginx_digest=%s\n' "$nginx_digest" >> "$GITHUB_OUTPUT"
      - name: Create API SBOM
        uses: anchore/sbom-action@v0.20.1
        with:
          image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: release/api.sbom.spdx.json
          upload-artifact: false
      - name: Create frontend SBOM
        uses: anchore/sbom-action@v0.20.1
        with:
          image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: release/frontend.sbom.spdx.json
          upload-artifact: false
      - name: Create Nginx SBOM
        uses: anchore/sbom-action@v0.20.1
        with:
          image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: release/nginx.sbom.spdx.json
          upload-artifact: false
      - name: Create release evidence manifest
        env:
          JIRA_KEY: ${{ needs.quality-gate.outputs.jira_key }}
          PR_NUMBER: ${{ needs.quality-gate.outputs.pr_number }}
        run: |
          mkdir -p release
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg jira_key "$JIRA_KEY" \
            --arg pr_number "$PR_NUMBER" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg created_at "$(date --utc +%FT%TZ)" \
            --arg api_repository "$ACR_LOGIN_SERVER/$API_IMAGE_NAME" \
            --arg api_digest "${{ steps.digests.outputs.api_digest }}" \
            --arg frontend_repository "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME" \
            --arg frontend_digest "${{ steps.digests.outputs.frontend_digest }}" \
            --arg nginx_repository "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME" \
            --arg nginx_digest "${{ steps.digests.outputs.nginx_digest }}" \
            '{
              schema_version: 1,
              commit: $commit,
              jira_key: $jira_key,
              pull_request: ($pr_number | tonumber),
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              created_at: $created_at,
              images: {
                api: {repository: $api_repository, digest: $api_digest},
                frontend: {repository: $frontend_repository, digest: $frontend_digest},
                nginx: {repository: $nginx_repository, digest: $nginx_digest}
              }
            }' > release/release-manifest.json
          (cd release && sha256sum release-manifest.json *.sbom.spdx.json > checksums.txt)
      - name: Publish release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish release summary
        env:
          JIRA_KEY: ${{ needs.quality-gate.outputs.jira_key }}
          PR_NUMBER: ${{ needs.quality-gate.outputs.pr_number }}
        run: |
          {
            echo "## Immutable release artifact"
            echo ""
            echo "- Jira: $JIRA_KEY"
            echo "- Pull request: #$PR_NUMBER"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- API: \`$ACR_LOGIN_SERVER/$API_IMAGE_NAME@${{ steps.digests.outputs.api_digest }}\`"
            echo "- Frontend: \`$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME@${{ steps.digests.outputs.frontend_digest }}\`"
            echo "- Nginx: \`$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME@${{ steps.digests.outputs.nginx_digest }}\`"
            echo ""
            echo "Deploy this release with run ID \`$GITHUB_RUN_ID\`."
          } >> "$GITHUB_STEP_SUMMARY"

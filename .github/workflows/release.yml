name: Build Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  API_IMAGE_NAME: my-api
  FRONTEND_IMAGE_NAME: my-fe
  NGINX_IMAGE_NAME: my-nginx
  RELEASE_TAG: sha-${{ github.sha }}

jobs:
  quality-gate:
    name: Validate merged and approved source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.trace.outputs.pr_number }}
      pr_url: ${{ steps.trace.outputs.pr_url }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require an approved pull request
        id: trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --header "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            > "$RUNNER_TEMP/pulls.json"

          pr_number="$(jq -er '[.[] | select(.base.ref == "master" and .merged_at != null)] | first | .number' "$RUNNER_TEMP/pulls.json")"
          gh pr view "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,state,mergedAt,baseRefName,headRefName,title,body,reviewDecision,url \
            > pr-metadata.json

          jq -e '
            .state == "MERGED" and
            .mergedAt != null and
            .baseRefName == "master" and
            .reviewDecision == "APPROVED" and
            (.body | type == "string" and length > 0)
          ' pr-metadata.json >/dev/null || {
            echo "::error::Release commit must come from an approved PR merged into master."
            exit 1
          }

          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"
          printf 'pr_url=%s\n' "$(jq -r '.url' pr-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build backend test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: platform-api-test:${{ github.sha }}
      - name: Run backend tests with coverage gate
        run: |
          mkdir -p quality-evidence
          chmod 0777 quality-evidence
          docker run --rm \
            -e DATABASE_URL=sqlite:////tmp/platform-app-test.db \
            -e ADMIN_EMAIL=alice@example.com \
            -v "$PWD/quality-evidence:/test-results" \
            platform-api-test:${{ github.sha }} \
            pytest -q -p no:cacheprovider /app/tests \
              --cov=app \
              --cov-report=term-missing \
              --cov-report=xml:/test-results/coverage.xml \
              --cov-fail-under=70
          mv pr-metadata.json quality-evidence/pr-metadata.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend from locked dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Run backend SAST
        run: |
          python -m pip install --disable-pip-version-check bandit==1.8.6
          bandit --recursive backend/app --severity-level medium --confidence-level medium

      - name: Scan source, dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0
      - name: Render production manifests
        run: |
          set -euo pipefail
          digest="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          helm lint ./deploy/helm/platform-app --values ./deploy/helm/platform-app/values-dev.yml
          helm template platform-app ./deploy/helm/platform-app \
            --namespace platform \
            --set-string api.image.digest="$digest" \
            --set-string frontend.image.digest="$digest" \
            --set-string nginx.image.digest="$digest" \
            > rendered-manifests.yaml
      - name: Install verified Conftest
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/conftest.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz
          echo "af879740a9b43aae21f928ed5d3571615c9d17b5d0551623a56d317812db0f98  $archive" \
            | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /usr/local/bin conftest
      - name: Enforce immutable-image policy
        run: conftest test --policy policy rendered-manifests.yaml

      - name: Publish quality evidence for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-evidence
          path: quality-evidence/
          if-no-files-found: error
          retention-days: 30

  build-release:
    name: Build, scan, attest, and publish immutable artifacts
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download quality evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-evidence
          path: release
      - name: Validate registry configuration
        run: |
          set -euo pipefail
          test -n "$ACR_NAME"
          test -n "$ACR_LOGIN_SERVER"
          test "$ACR_LOGIN_SERVER" = "$ACR_NAME.azurecr.io"

      - name: Sign in to Azure with the build OIDC identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build release images exactly once
        run: |
          set -euo pipefail
          docker build --file backend/Dockerfile --target runtime --tag "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$RELEASE_TAG" backend
          docker build --file frontend/Dockerfile --tag "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:$RELEASE_TAG" frontend
          docker build --file nginx/Dockerfile --tag "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME:$RELEASE_TAG" nginx

      - name: Smoke test the exact release images
        run: |
          set -euo pipefail
          network="release-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            docker rm --force release-nginx release-frontend release-api >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network"
          docker run --detach --network "$network" --name release-api --network-alias api \
            -e DATABASE_URL=sqlite:////tmp/release-smoke.db \
            -e ADMIN_EMAIL=release-smoke@example.com \
            "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$RELEASE_TAG"
          docker run --detach --network "$network" --name release-frontend \
            --network-alias frontend --network-alias minio \
            "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:$RELEASE_TAG"
          docker run --detach --network "$network" --name release-nginx --network-alias nginx \
            --publish 18080:8080 \
            "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME:$RELEASE_TAG"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/ready >/dev/null; then
              break
            fi
            test "$attempt" -lt 30 || {
              docker logs release-api || true
              docker logs release-frontend || true
              docker logs release-nginx || true
              exit 1
            }
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/ >/dev/null
          curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null

      - name: Scan API release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan frontend release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true
      - name: Scan Nginx release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.NGINX_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Push images after all quality gates pass
        run: |
          set -euo pipefail
          docker push "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$RELEASE_TAG"
          docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:$RELEASE_TAG"
          docker push "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME:$RELEASE_TAG"

      - name: Resolve immutable ACR digests
        id: digests
        run: |
          set -euo pipefail
          api_digest="$(az acr repository show --name "$ACR_NAME" --image "$API_IMAGE_NAME:$RELEASE_TAG" --query digest --output tsv)"
          frontend_digest="$(az acr repository show --name "$ACR_NAME" --image "$FRONTEND_IMAGE_NAME:$RELEASE_TAG" --query digest --output tsv)"
          nginx_digest="$(az acr repository show --name "$ACR_NAME" --image "$NGINX_IMAGE_NAME:$RELEASE_TAG" --query digest --output tsv)"
          for digest in "$api_digest" "$frontend_digest" "$nginx_digest"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done
          printf 'api=%s\nfrontend=%s\nnginx=%s\n' "$api_digest" "$frontend_digest" "$nginx_digest" >> "$GITHUB_OUTPUT"

      - name: Generate API SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}@${{ steps.digests.outputs.api }}
          format: cyclonedx-json
          output-file: release/api-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}@${{ steps.digests.outputs.frontend }}
          format: cyclonedx-json
          output-file: release/frontend-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate Nginx SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.NGINX_IMAGE_NAME }}@${{ steps.digests.outputs.nginx }}
          format: cyclonedx-json
          output-file: release/nginx-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest API build provenance
        id: api_attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.api }}
          push-to-registry: true
      - name: Attest frontend build provenance
        id: frontend_attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.frontend }}
          push-to-registry: true
      - name: Attest Nginx build provenance
        id: nginx_attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.ACR_LOGIN_SERVER }}/${{ env.NGINX_IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.nginx }}
          push-to-registry: true

      - name: Create immutable release manifest
        env:
          PR_NUMBER: ${{ needs.quality-gate.outputs.pr_number }}
          PR_URL: ${{ needs.quality-gate.outputs.pr_url }}
          API_DIGEST: ${{ steps.digests.outputs.api }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend }}
          NGINX_DIGEST: ${{ steps.digests.outputs.nginx }}
          API_ATTESTATION_URL: ${{ steps.api_attest.outputs.attestation-url }}
          FRONTEND_ATTESTATION_URL: ${{ steps.frontend_attest.outputs.attestation-url }}
          NGINX_ATTESTATION_URL: ${{ steps.nginx_attest.outputs.attestation-url }}
          API_BUNDLE: ${{ steps.api_attest.outputs.bundle-path }}
          FRONTEND_BUNDLE: ${{ steps.frontend_attest.outputs.bundle-path }}
          NGINX_BUNDLE: ${{ steps.nginx_attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$API_BUNDLE" release/api-provenance.sigstore.json
          cp "$FRONTEND_BUNDLE" release/frontend-provenance.sigstore.json
          cp "$NGINX_BUNDLE" release/nginx-provenance.sigstore.json

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_url "$PR_URL" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg image_tag "$RELEASE_TAG" \
            --arg created_at "$(date --utc +%FT%TZ)" \
            --arg api_repository "$ACR_LOGIN_SERVER/$API_IMAGE_NAME" \
            --arg api_digest "$API_DIGEST" \
            --arg api_attestation_url "$API_ATTESTATION_URL" \
            --arg frontend_repository "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME" \
            --arg frontend_digest "$FRONTEND_DIGEST" \
            --arg frontend_attestation_url "$FRONTEND_ATTESTATION_URL" \
            --arg nginx_repository "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME" \
            --arg nginx_digest "$NGINX_DIGEST" \
            --arg nginx_attestation_url "$NGINX_ATTESTATION_URL" \
            '{
              schema_version: 2,
              commit: $commit,
              change: {type: "github_pull_request", number: ($pr_number | tonumber), url: $pr_url},
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              created_at: $created_at,
              images: {
                api: {
                  repository: $api_repository, tag: $image_tag, digest: $api_digest,
                  sbom: "api-sbom.cdx.json", provenance: "api-provenance.sigstore.json",
                  attestation_url: $api_attestation_url
                },
                frontend: {
                  repository: $frontend_repository, tag: $image_tag, digest: $frontend_digest,
                  sbom: "frontend-sbom.cdx.json", provenance: "frontend-provenance.sigstore.json",
                  attestation_url: $frontend_attestation_url
                },
                nginx: {
                  repository: $nginx_repository, tag: $image_tag, digest: $nginx_digest,
                  sbom: "nginx-sbom.cdx.json", provenance: "nginx-provenance.sigstore.json",
                  attestation_url: $nginx_attestation_url
                }
              }
            }' > release/release-manifest.json

          (cd release && sha256sum *.json > checksums.txt)

      - name: Publish release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: release/
          if-no-files-found: error
          retention-days: 365

      - name: Publish release summary
        env:
          PR_URL: ${{ needs.quality-gate.outputs.pr_url }}
        run: |
          {
            echo "## Immutable application release"
            echo
            echo "- Change record: $PR_URL"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- API: \`$ACR_LOGIN_SERVER/$API_IMAGE_NAME@${{ steps.digests.outputs.api }}\`"
            echo "- Frontend: \`$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME@${{ steps.digests.outputs.frontend }}\`"
            echo "- Nginx: \`$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME@${{ steps.digests.outputs.nginx }}\`"
            echo "- Evidence: SBOM, signed provenance, coverage, manifest, and checksums"
            echo
            echo "Deploy with Build Release run ID \`$GITHUB_RUN_ID\`."
          } >> "$GITHUB_STEP_SUMMARY"

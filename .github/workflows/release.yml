name: Build Release

on:
  push:
    branches: [master]

# Default workflow permissions stay minimal.
permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  API_IMAGE_NAME: my-api
  FRONTEND_IMAGE_NAME: my-fe
  NGINX_IMAGE_NAME: my-nginx

  # Include run_attempt so a rerun does not overwrite the previous tag.
  RELEASE_TAG: v${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  # ============================================================
  # 1. Validate source and run quality gates
  # ============================================================
  quality-gate:
    name: Validate merged source
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      jira_key: ${{ steps.trace.outputs.jira_key }}
      pr_number: ${{ steps.trace.outputs.pr_number }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Require the commit pushed to master to be associated with a PR that was
      # merged into master. Approval is intentionally NOT required here.
      - name: Require a merged pull request
        id: trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            --header "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            > "$RUNNER_TEMP/pulls.json"

          pr_number="$(
            jq -r '
              [.[] | select(.base.ref == "master" and .merged_at != null)]
              | first
              | .number // empty
            ' "$RUNNER_TEMP/pulls.json"
          )"

          if [[ -z "$pr_number" ]]; then
            echo "::error::Release commit must come from a pull request merged into master."
            exit 1
          fi

          gh pr view "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,state,mergedAt,baseRefName \
            > "$RUNNER_TEMP/pr-metadata.json"

          jq -e '
            .state == "MERGED" and
            .mergedAt != null and
            .baseRefName == "master"
          ' "$RUNNER_TEMP/pr-metadata.json" >/dev/null || {
            echo "::error::Release commit must come from a merged PR into master."
            exit 1
          }

          # Jira is optional in this workflow.
          printf 'jira_key=\n' >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend test image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: platform-api-test:${{ github.sha }}

      - name: Run backend tests
        run: |
          set -euo pipefail

          docker run --rm \
            -e DATABASE_URL=sqlite:////tmp/platform-app-test.db \
            -e ADMIN_EMAIL=alice@example.com \
            platform-api-test:${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend from locked dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run backend SAST
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check bandit==1.8.6
          bandit --recursive backend/app --severity-level medium --confidence-level medium

      - name: Scan source, dependencies, secrets, and IaC
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          # Helm output is rendered and validated separately below.
          skip-dirs: deploy/helm/platform-app
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Render production manifests
        run: |
          set -euo pipefail

          digest="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

          # Keep this configuration aligned with Deploy Production.
          helm lint ./deploy/helm/platform-app \
            --set-string api.image.digest="$digest" \
            --set-string frontend.image.digest="$digest" \
            --set-string nginx.image.digest="$digest" \
            --set minio.enabled=false \
            --set keyVault.enabled=false

          helm template platform-app ./deploy/helm/platform-app \
            --namespace platform \
            --set-string api.image.digest="$digest" \
            --set-string frontend.image.digest="$digest" \
            --set-string nginx.image.digest="$digest" \
            --set minio.enabled=false \
            --set keyVault.enabled=false \
            > rendered-manifests.yaml

      - name: Install verified Conftest
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/conftest.tar.gz"

          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz

          echo "af879740a9b43aae21f928ed5d3571615c9d17b5d0551623a56d317812db0f98  $archive" \
            | sha256sum --check

          tar --extract --gzip --file "$archive" --directory /usr/local/bin conftest

      - name: Enforce immutable-image policy
        run: conftest test --policy policy rendered-manifests.yaml

  # ============================================================
  # 2. Build, validate, scan, and publish release artifacts
  # ============================================================
  build-release:
    name: Build, scan, and publish immutable artifacts
    needs: quality-gate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6

      - name: Validate registry configuration
        run: |
          set -euo pipefail
          test -n "$ACR_NAME"
          test -n "$ACR_LOGIN_SERVER"
          test "$ACR_LOGIN_SERVER" = "$ACR_NAME.azurecr.io"

      - name: Sign in to Azure with the build OIDC identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build release images once
        run: |
          set -euo pipefail

          # Dockerfile's final stage is test; production must use runtime.
          docker build \
            --file backend/Dockerfile \
            --target runtime \
            --tag "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$RELEASE_TAG" \
            backend

          docker build \
            --file frontend/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:$RELEASE_TAG" \
            frontend

          docker build \
            --file nginx/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME:$RELEASE_TAG" \
            nginx

      # This catches runtime dependency mistakes such as:
      # ModuleNotFoundError: No module named 'psycopg'
      - name: Validate API runtime dependencies
        run: |
          set -euo pipefail

          docker run --rm \
            --entrypoint python \
            "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$RELEASE_TAG" \
            -c "import fastapi, sqlalchemy, psycopg; print('API runtime dependencies OK')"

      - name: Scan API release image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend release image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Scan Nginx release image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.NGINX_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Push images after all quality gates pass
        run: |
          set -euo pipefail

          docker push "$ACR_LOGIN_SERVER/$API_IMAGE_NAME:$RELEASE_TAG"
          docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:$RELEASE_TAG"
          docker push "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME:$RELEASE_TAG"

      - name: Resolve immutable ACR digests
        id: digests
        run: |
          set -euo pipefail

          api_digest="$(
            az acr repository show \
              --name "$ACR_NAME" \
              --image "$API_IMAGE_NAME:$RELEASE_TAG" \
              --query digest \
              --output tsv
          )"

          frontend_digest="$(
            az acr repository show \
              --name "$ACR_NAME" \
              --image "$FRONTEND_IMAGE_NAME:$RELEASE_TAG" \
              --query digest \
              --output tsv
          )"

          nginx_digest="$(
            az acr repository show \
              --name "$ACR_NAME" \
              --image "$NGINX_IMAGE_NAME:$RELEASE_TAG" \
              --query digest \
              --output tsv
          )"

          for digest in "$api_digest" "$frontend_digest" "$nginx_digest"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done

          printf 'api_digest=%s\n' "$api_digest" >> "$GITHUB_OUTPUT"
          printf 'frontend_digest=%s\n' "$frontend_digest" >> "$GITHUB_OUTPUT"
          printf 'nginx_digest=%s\n' "$nginx_digest" >> "$GITHUB_OUTPUT"

      - name: Create immutable release manifest
        env:
          JIRA_KEY: ${{ needs.quality-gate.outputs.jira_key }}
          PR_NUMBER: ${{ needs.quality-gate.outputs.pr_number }}
        run: |
          set -euo pipefail

          mkdir -p release

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg jira_key "$JIRA_KEY" \
            --arg pr_number "$PR_NUMBER" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg image_tag "$RELEASE_TAG" \
            --arg created_at "$(date --utc +%FT%TZ)" \
            --arg api_repository "$ACR_LOGIN_SERVER/$API_IMAGE_NAME" \
            --arg api_digest "${{ steps.digests.outputs.api_digest }}" \
            --arg frontend_repository "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME" \
            --arg frontend_digest "${{ steps.digests.outputs.frontend_digest }}" \
            --arg nginx_repository "$ACR_LOGIN_SERVER/$NGINX_IMAGE_NAME" \
            --arg nginx_digest "${{ steps.digests.outputs.nginx_digest }}" \
            '{
              schema_version: 1,
              commit: $commit,
              jira_key: $jira_key,
              pull_request: $pr_number,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              created_at: $created_at,
              images: {
                api: {
                  repository: $api_repository,
                  tag: $image_tag,
                  digest: $api_digest
                },
                frontend: {
                  repository: $frontend_repository,
                  tag: $image_tag,
                  digest: $frontend_digest
                },
                nginx: {
                  repository: $nginx_repository,
                  tag: $image_tag,
                  digest: $nginx_digest
                }
              }
            }' > release/release-manifest.json

          (
            cd release
            sha256sum release-manifest.json > checksums.txt
          )

      - name: Publish release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish build summary
        run: |
          {
            echo "## Build Release complete"
            echo
            echo "- Pull Request: #${{ needs.quality-gate.outputs.pr_number }}"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- API digest: \`${{ steps.digests.outputs.api_digest }}\`"
            echo "- Frontend digest: \`${{ steps.digests.outputs.frontend_digest }}\`"
            echo "- Nginx digest: \`${{ steps.digests.outputs.nginx_digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Build Release workflow run ID
        required: true
        type: string
# ============================================================
# Workflow permissions
# ============================================================
permissions:
  contents: read
  actions: read
# ============================================================
# Prevent multiple production deployments at the same time
# ============================================================
concurrency:
  group: production-platform-app
  cancel-in-progress: false
# ============================================================
# Global configuration
# ============================================================
env:
  AKS_RG: ${{ vars.AKS_RESOURCE_GROUP }}
  AKS_NAME: ${{ vars.AKS_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  NAMESPACE: ${{ vars.K8S_NAMESPACE || 'platform' }}
  RELEASE_NAME: platform-app
  # Internal URL reachable from inside Kubernetes.
  # Change this variable if your nginx Service has another name/path.
  INTERNAL_SMOKE_URL: ${{ vars.INTERNAL_SMOKE_URL || 'http://nginx/health' }}
  # Optional.
  # It can be empty until you expose the application publicly.
  PUBLIC_SMOKE_TEST_URL: ${{ vars.PROD_SMOKE_TEST_URL || '' }}
jobs:
  # ==========================================================
  # 1. Resolve and validate Build Release
  # ==========================================================
  resolve-release:
    name: Validate release evidence
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.manifest.outputs.commit }}
      pr_number: ${{ steps.manifest.outputs.pr_number }}
      api_repository: ${{ steps.manifest.outputs.api_repository }}
      api_digest: ${{ steps.manifest.outputs.api_digest }}
      frontend_repository: ${{ steps.manifest.outputs.frontend_repository }}
      frontend_digest: ${{ steps.manifest.outputs.frontend_digest }}
      nginx_repository: ${{ steps.manifest.outputs.nginx_repository }}
      nginx_digest: ${{ steps.manifest.outputs.nginx_digest }}
    steps:
      # --------------------------------------------------------
      # Validate Run ID
      # --------------------------------------------------------
      - name: Validate release run ID
        run: |
          if ! [[ "${{ inputs.release_run_id }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::release_run_id must be a valid GitHub Actions run ID."
            exit 1
          fi
      # The selected Build Release run is the source of truth for the image
      # repositories and digests. Do not accept values entered at dispatch time.
      - name: Download and verify release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.release_run_id }}")"
          test "$(jq -r '.name' <<< "$run_json")" = "Build Release" || {
            echo "::error::release_run_id must belong to the Build Release workflow."
            exit 1
          }
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success" || {
            echo "::error::The selected Build Release run was not successful."
            exit 1
          }
          mkdir -p release
          gh run download "${{ inputs.release_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name release-evidence \
            --dir release
          (cd release && sha256sum --check checksums.txt)
      - name: Read immutable release manifest
        id: manifest
        run: |
          set -euo pipefail
          manifest="release/release-manifest.json"
          test -f "$manifest" || {
            echo "::error::release-manifest.json is missing from release evidence."
            exit 1
          }
          commit="$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' "$manifest")"
          workflow_run_id="$(jq -er '.workflow_run_id | tostring' "$manifest")"
          test "$workflow_run_id" = "${{ inputs.release_run_id }}" || {
            echo "::error::The manifest does not belong to the selected release run."
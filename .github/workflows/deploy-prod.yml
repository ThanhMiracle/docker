name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Build Release workflow run ID
        required: true
        type: string
# ============================================================
# Workflow permissions
# ============================================================
permissions:
  contents: read
  actions: read
# ============================================================
# Prevent multiple production deployments at the same time
# ============================================================
concurrency:
  group: production-platform-app
  cancel-in-progress: false
# ============================================================
# Global configuration
# ============================================================
env:
  AKS_RG: ${{ vars.AKS_RESOURCE_GROUP }}
  AKS_NAME: ${{ vars.AKS_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  NAMESPACE: ${{ vars.K8S_NAMESPACE || 'platform' }}
  RELEASE_NAME: platform-app
  # Internal URL reachable from inside Kubernetes.
  # Change this variable if your nginx Service has another name/path.
  INTERNAL_SMOKE_URL: ${{ vars.INTERNAL_SMOKE_URL || 'http://nginx/health' }}
  # Optional.
  # It can be empty until you expose the application publicly.
  PUBLIC_SMOKE_TEST_URL: ${{ vars.PROD_SMOKE_TEST_URL || '' }}
jobs:
  # ==========================================================
  # 1. Resolve and validate Build Release
  # ==========================================================
  resolve-release:
    name: Validate release evidence
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.manifest.outputs.commit }}
      pr_number: ${{ steps.manifest.outputs.pr_number }}
      api_repository: ${{ steps.manifest.outputs.api_repository }}
      api_digest: ${{ steps.manifest.outputs.api_digest }}
      frontend_repository: ${{ steps.manifest.outputs.frontend_repository }}
      frontend_digest: ${{ steps.manifest.outputs.frontend_digest }}
      nginx_repository: ${{ steps.manifest.outputs.nginx_repository }}
      nginx_digest: ${{ steps.manifest.outputs.nginx_digest }}
    steps:
      # --------------------------------------------------------
      # Validate Run ID
      # --------------------------------------------------------
      - name: Validate release run ID
        run: |
          if ! [[ "${{ inputs.release_run_id }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::release_run_id must be a valid GitHub Actions run ID."
            exit 1
          fi
      # The selected Build Release run is the source of truth for the image
      # repositories and digests. Do not accept values entered at dispatch time.
      - name: Download and verify release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.release_run_id }}")"
          test "$(jq -r '.name' <<< "$run_json")" = "Build Release" || {
            echo "::error::release_run_id must belong to the Build Release workflow."
            exit 1
          }
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success" || {
            echo "::error::The selected Build Release run was not successful."
            exit 1
          }
          mkdir -p release
          gh run download "${{ inputs.release_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name release-evidence \
            --dir release
          (cd release && sha256sum --check checksums.txt)
      - name: Read immutable release manifest
        id: manifest
        run: |
          set -euo pipefail
          manifest="release/release-manifest.json"
          test -f "$manifest" || {
            echo "::error::release-manifest.json is missing from release evidence."
            exit 1
          }
          commit="$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' "$manifest")"
          workflow_run_id="$(jq -er '.workflow_run_id | tostring' "$manifest")"
          test "$workflow_run_id" = "${{ inputs.release_run_id }}" || {
            echo "::error::The manifest does not belong to the selected release run."
            exit 1
          }
          for image in api frontend nginx; do
            repository="$(jq -er ".images.$image.repository | select(type == \"string\" and length > 0)" "$manifest")"
            digest="$(jq -er ".images.$image.digest | select(test(\"^sha256:[a-f0-9]{64}$\"))" "$manifest")"
            printf '%s_repository=%s\n' "$image" "$repository" >> "$GITHUB_OUTPUT"
            printf '%s_digest=%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
          done
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$(jq -r '.pull_request // empty' "$manifest")" >> "$GITHUB_OUTPUT"
  # ==========================================================
  # 2. Deploy Production
  # ==========================================================
  deploy:
    name: Approved production deployment
    needs:
      - resolve-release
    # GitHub Environment
    #
    # You can configure:
    # Settings -> Environments -> production
    # -> Required reviewers
    #
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # --------------------------------------------------------
      # Checkout EXACT commit used by Build Release
      # --------------------------------------------------------
      - name: Checkout approved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
      # --------------------------------------------------------
      # Install kubectl
      # --------------------------------------------------------
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      # --------------------------------------------------------
      # Install Helm
      # --------------------------------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      # --------------------------------------------------------
      # Install Azure kubelogin
      # --------------------------------------------------------
      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.19
      # --------------------------------------------------------
      # Validate production configuration
      # --------------------------------------------------------
      - name: Validate production configuration
        env:
          AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # Bootstrap deployments use the existing Kubernetes Secret. Key Vault
          # is enabled later after its workload identity has been validated.
          KEY_VAULT_ENABLED: "false"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            AKS_RG \
            AKS_NAME \
            ACR_LOGIN_SERVER \
            AZURE_DEPLOY_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            JWT_SECRET \
            ADMIN_EMAIL \
            SMTP_HOST \
            SMTP_USERNAME \
            SMTP_PASSWORD \
            SMTP_FROM \
            MINIO_ROOT_USER \
            MINIO_ROOT_PASSWORD
          do
            test -n "${!name}" || {
              echo "::error::$name is missing or empty"
              exit 1
            }
          done
          # ----------------------------------------------------
          # Validate Key Vault configuration
          # ----------------------------------------------------
          if [[ "$KEY_VAULT_ENABLED" = "true" ]]; then
            test -n "$KEY_VAULT_NAME" || {
              echo "::error::KEY_VAULT_NAME is required when Key Vault is enabled."
              exit 1
            }
            test -n "$API_KEYVAULT_CLIENT_ID" || {
              echo "::error::API_KEYVAULT_CLIENT_ID is required when Key Vault is enabled."
              exit 1
            }
          else
            test -n "$DATABASE_URL" || {
              echo "::error::DATABASE_URL is required when Key Vault is disabled."
              exit 1
            }
          fi
      # --------------------------------------------------------
      # Azure authentication using OIDC
      # --------------------------------------------------------
      - name: Sign in to Azure with production OIDC identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # --------------------------------------------------------
      # Connect GitHub Runner to AKS
      # --------------------------------------------------------
      - name: Set AKS context
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "$AKS_RG" \
            --name "$AKS_NAME" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client \
            --output yaml \
            | kubectl apply -f -
          echo ""
          echo "Connected to AKS:"
          kubectl get nodes
      # --------------------------------------------------------
      # Create / update Kubernetes runtime secrets
      # --------------------------------------------------------
      - name: Apply application runtime secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          kubectl create secret generic platform-app-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ADMIN_EMAIL="$ADMIN_EMAIL" \
            --from-literal=SMTP_HOST="$SMTP_HOST" \
            --from-literal=SMTP_USERNAME="$SMTP_USERNAME" \
            --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
            --from-literal=SMTP_FROM="$SMTP_FROM" \
            --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            --from-literal=MINIO_ACCESS_KEY="$MINIO_ROOT_USER" \
            --from-literal=MINIO_SECRET_KEY="$MINIO_ROOT_PASSWORD" \
            --from-literal=ALERT_WEBHOOK_URL="$ALERT_WEBHOOK_URL" \
            --dry-run=client \
            --output yaml \
            | kubectl apply -f -
      # --------------------------------------------------------
      # Recover an incomplete first Helm install left by a failed run
      # --------------------------------------------------------
      - name: Recover stale failed initial Helm install
        run: |
          set -euo pipefail
          if ! helm status "$RELEASE_NAME" \
            --namespace "$NAMESPACE" \
            >/dev/null 2>&1; then
            echo "No existing Helm release."
            exit 0
          fi
          status="$(
            helm status "$RELEASE_NAME" \
              --namespace "$NAMESPACE" \
              --output json \
            | jq -r '.info.status // empty'
          )"
          revision="$(
            helm status "$RELEASE_NAME" \
              --namespace "$NAMESPACE" \
              --output json \
            | jq -r '.version // 0'
          )"
          echo "Current Helm status: $status"
          echo "Current Helm revision: $revision"
          if [[ "$status" == "pending-install" && "$revision" == "1" ]]; then
            echo "::warning::Removing stale failed initial Helm installation."
            helm uninstall "$RELEASE_NAME" \
              --namespace "$NAMESPACE" \
              --wait \
              --timeout 5m
          fi
      # --------------------------------------------------------
      # Deploy immutable release using Helm
      # --------------------------------------------------------
      - name: Deploy approved immutable release
        env:
          KEY_VAULT_ENABLED: "false"
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          API_KEYVAULT_CLIENT_ID: ${{ vars.API_KEYVAULT_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          key_vault_args=(
            --set "keyVault.enabled=$KEY_VAULT_ENABLED"
          )
          if [[ "$KEY_VAULT_ENABLED" = "true" ]]; then
            key_vault_args+=(
              --set-string "keyVault.name=$KEY_VAULT_NAME"
              --set-string "keyVault.tenantId=$AZURE_TENANT_ID"
              --set-string "keyVault.clientId=$API_KEYVAULT_CLIENT_ID"
            )
          fi
          helm upgrade --install "$RELEASE_NAME" \
            ./deploy/helm/platform-app \
            --namespace "$NAMESPACE" \
            --set-string api.image.repository="${{ needs.resolve-release.outputs.api_repository }}" \
            --set-string api.image.digest="${{ needs.resolve-release.outputs.api_digest }}" \
            --set-string frontend.image.repository="${{ needs.resolve-release.outputs.frontend_repository }}" \
            --set-string frontend.image.digest="${{ needs.resolve-release.outputs.frontend_digest }}" \
            --set-string nginx.image.repository="${{ needs.resolve-release.outputs.nginx_repository }}" \
            --set-string nginx.image.digest="${{ needs.resolve-release.outputs.nginx_digest }}" \
            --set-string release.commit="${{ needs.resolve-release.outputs.commit }}" \
            --set-string release.workflowRunId="${{ inputs.release_run_id }}" \
            --set minio.enabled=false \
            "${key_vault_args[@]}" \
            --atomic \
            --cleanup-on-fail \
            --wait \
            --timeout 10m \
            --history-max 20
      # --------------------------------------------------------
      # Verify Kubernetes deployment
      # --------------------------------------------------------
      - name: Verify rollout and running image digests
        run: |
          bash scripts/verify-deployment.sh \
            "$NAMESPACE" \
            "${{ needs.resolve-release.outputs.api_digest }}" \
            "${{ needs.resolve-release.outputs.frontend_digest }}" \
            "${{ needs.resolve-release.outputs.nginx_digest }}" \
            false
      # --------------------------------------------------------
      # Internal smoke test
      #
      # Does NOT require Public IP.
      #
      # Creates a temporary curl Pod inside AKS.
      # --------------------------------------------------------
      - name: Run internal smoke test
        run: |
          echo "Internal smoke test URL:"
          echo "$INTERNAL_SMOKE_URL"
          kubectl run \
            "smoke-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --namespace "$NAMESPACE" \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --rm \
            --attach=true \
            -- \
            --fail \
            --show-error \
            --silent \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            "$INTERNAL_SMOKE_URL"
          echo ""
          echo "Internal smoke test passed."
      # --------------------------------------------------------
      # Optional Public Smoke Test
      #
      # This step is skipped until PROD_SMOKE_TEST_URL exists.
      #
      # Example:
      #
      # PROD_SMOKE_TEST_URL=http://20.x.x.x
      #
      # or
      #
      # PROD_SMOKE_TEST_URL=https://app.example.com
      #
      # --------------------------------------------------------
      - name: Run public smoke test
        if: ${{ env.PUBLIC_SMOKE_TEST_URL != '' }}
        run: |
          echo "Running public smoke test:"
          echo "$PUBLIC_SMOKE_TEST_URL"
          bash scripts/smoke-test.sh "$PUBLIC_SMOKE_TEST_URL"
      # --------------------------------------------------------
      # Successful deployment evidence
      # --------------------------------------------------------
      - name: Write deployment evidence
        run: |
          {
            echo "## Production release verified"
            echo ""
            echo "- Build Release Run ID: ${{ inputs.release_run_id }}"
            echo "- Pull Request: #${{ needs.resolve-release.outputs.pr_number }}"
            echo "- Commit: \`${{ needs.resolve-release.outputs.commit }}\`"
            echo "- Helm release: $RELEASE_NAME"
            echo "- Namespace: $NAMESPACE"
            echo "- Deployment identity: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}"
            echo "- Internal smoke test: \`$INTERNAL_SMOKE_URL\`"
            if [ -n "$PUBLIC_SMOKE_TEST_URL" ]; then
              echo "- Public smoke test: \`$PUBLIC_SMOKE_TEST_URL\`"
            else
              echo "- Public smoke test: skipped (no public endpoint configured)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # --------------------------------------------------------
      # Collect diagnostics if deployment fails
      # --------------------------------------------------------
      - name: Collect failure diagnostics
        if: failure()
        run: |
          echo "========================================"
          echo "Helm release"
          echo "========================================"
          helm status "$RELEASE_NAME" \
            --namespace "$NAMESPACE" || true
          echo ""
          helm history "$RELEASE_NAME" \
            --namespace "$NAMESPACE" || true
          echo ""
          echo "========================================"
          echo "Kubernetes workloads"
          echo "========================================"
          kubectl get \
            deployments,statefulsets,pods,services,endpoints \
            --namespace "$NAMESPACE" \
            -o wide || true
          echo ""
          echo "========================================"
          echo "Recent Kubernetes events"
          echo "========================================"
          kubectl get events \
            --namespace "$NAMESPACE" \
            --sort-by=.lastTimestamp \
            | tail -n 100 || true
          echo ""
          echo "========================================"
          echo "Application logs"
          echo "========================================"
          for workload in api frontend nginx
          do
            echo ""
            echo "----- $workload -----"
            kubectl logs \
              "deployment/$workload" \
              --namespace "$NAMESPACE" \
              --tail=100 || true
          done
          {
            echo "## Deployment verification failed"
            echo ""
            echo "Helm atomic rollback/cleanup is enabled."
            echo ""
            echo "Review the deployment diagnostics before choosing:"
            echo "- rollback"
            echo "- recovery"
            echo "- roll-forward"
            echo "- pause"
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Build Release workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-platform-app
  cancel-in-progress: false

env:
  AKS_RG: ${{ vars.AKS_RESOURCE_GROUP }}
  AKS_NAME: ${{ vars.AKS_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  NAMESPACE: ${{ vars.K8S_NAMESPACE || 'platform' }}
  RELEASE_NAME: platform-app
  INTERNAL_SMOKE_URL: ${{ vars.INTERNAL_SMOKE_URL || 'http://nginx' }}
  PUBLIC_SMOKE_TEST_URL: ${{ vars.PROD_SMOKE_TEST_URL || '' }}

jobs:
  resolve-release:
    name: Validate immutable release evidence
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.manifest.outputs.commit }}
      pr_number: ${{ steps.manifest.outputs.pr_number }}
      api_repository: ${{ steps.manifest.outputs.api_repository }}
      api_digest: ${{ steps.manifest.outputs.api_digest }}
      frontend_repository: ${{ steps.manifest.outputs.frontend_repository }}
      frontend_digest: ${{ steps.manifest.outputs.frontend_digest }}
      nginx_repository: ${{ steps.manifest.outputs.nginx_repository }}
      nginx_digest: ${{ steps.manifest.outputs.nginx_digest }}
    steps:
      - name: Validate deployment request
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master" || {
            echo "::error::Production deployment must be dispatched from master."
            exit 1
          }
          [[ "${{ inputs.release_run_id }}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::release_run_id must be a valid GitHub Actions run ID."
            exit 1
          }

      - name: Validate Build Release workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.release_run_id }}")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            '.name == "Build Release" and
             .path == ".github/workflows/release.yml" and
             .event == "push" and
             .head_branch == "master" and
             .conclusion == "success" and
             .repository.full_name == $repository' \
            <<< "$run_json" >/dev/null || {
              echo "::error::The selected run is not a successful master Build Release run from this repository."
              exit 1
            }
          jq -r '.head_sha' <<< "$run_json" > "$RUNNER_TEMP/release-head-sha"

      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence
          path: release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Validate release manifest, checksums, SBOMs, and provenance
        id: manifest
        run: |
          set -euo pipefail
          (cd release && sha256sum --check checksums.txt)
          manifest="release/release-manifest.json"
          jq --exit-status '.schema_version == 2' "$manifest" >/dev/null

          commit="$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' "$manifest")"
          test "$commit" = "$(cat "$RUNNER_TEMP/release-head-sha")" || {
            echo "::error::Manifest commit does not match the selected workflow run."
            exit 1
          }
          test "$(jq -r '.workflow_run_id' "$manifest")" = "${{ inputs.release_run_id }}"

          pr_number="$(jq -er '.change.number | select(type == "number")' "$manifest")"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]

          for image in api frontend nginx; do
            repository="$(jq -er ".images.$image.repository" "$manifest")"
            digest="$(jq -er ".images.$image.digest | select(test(\"^sha256:[a-f0-9]{64}$\"))" "$manifest")"
            sbom="$(jq -er ".images.$image.sbom" "$manifest")"
            provenance="$(jq -er ".images.$image.provenance" "$manifest")"
            test -s "release/$sbom"
            test -s "release/$provenance"
            printf '%s_repository=%s\n' "$image" "$repository" >> "$GITHUB_OUTPUT"
            printf '%s_digest=%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
          done

          test "$(jq -r '.images.api.repository' "$manifest")" = "$ACR_LOGIN_SERVER/my-api"
          test "$(jq -r '.images.frontend.repository' "$manifest")" = "$ACR_LOGIN_SERVER/my-fe"
          test "$(jq -r '.images.nginx.repository' "$manifest")" = "$ACR_LOGIN_SERVER/my-nginx"

          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Write approval context
        run: |
          {
            echo "## Production deployment awaiting approval"
            echo
            echo "- Pull request: #${{ steps.manifest.outputs.pr_number }}"
            echo "- Commit: \`${{ steps.manifest.outputs.commit }}\`"
            echo "- Build Release run: ${{ inputs.release_run_id }}"
            echo "- Release evidence: checksum-verified SBOM and signed provenance"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Approved production deployment
    needs: resolve-release
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0
      - name: Set up kubelogin
        uses: azure/use-kubelogin@76597ae0fcbaace21b05e13a2cbf8daee2c6e820 # v1
        with:
          kubelogin-version: v0.2.19

      - name: Validate production configuration
        env:
          AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          KEY_VAULT_ENABLED: ${{ vars.KEY_VAULT_ENABLED || 'false' }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          API_KEYVAULT_CLIENT_ID: ${{ vars.API_KEYVAULT_CLIENT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            AKS_RG AKS_NAME ACR_LOGIN_SERVER AZURE_DEPLOY_CLIENT_ID AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID JWT_SECRET ADMIN_EMAIL SMTP_HOST SMTP_USERNAME \
            SMTP_PASSWORD SMTP_FROM MINIO_ROOT_USER MINIO_ROOT_PASSWORD
          do
            test -n "${!name}" || { echo "::error::$name is missing or empty"; exit 1; }
          done
          if [[ "$KEY_VAULT_ENABLED" = "true" ]]; then
            test -n "$KEY_VAULT_NAME"
            test -n "$API_KEYVAULT_CLIENT_ID"
          else
            test "$KEY_VAULT_ENABLED" = "false"
            test -n "$DATABASE_URL"
          fi

      - name: Sign in to Azure with production OIDC identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "$AKS_RG" \
            --name "$AKS_NAME" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl get namespace "$NAMESPACE" >/dev/null

      - name: Apply application runtime secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          kubectl create secret generic platform-app-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ADMIN_EMAIL="$ADMIN_EMAIL" \
            --from-literal=SMTP_HOST="$SMTP_HOST" \
            --from-literal=SMTP_USERNAME="$SMTP_USERNAME" \
            --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
            --from-literal=SMTP_FROM="$SMTP_FROM" \
            --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            --from-literal=MINIO_ACCESS_KEY="$MINIO_ROOT_USER" \
            --from-literal=MINIO_SECRET_KEY="$MINIO_ROOT_PASSWORD" \
            --from-literal=ALERT_WEBHOOK_URL="$ALERT_WEBHOOK_URL" \
            --dry-run=client --output yaml \
            | kubectl apply -f -

      - name: Deploy approved immutable release
        env:
          KEY_VAULT_ENABLED: ${{ vars.KEY_VAULT_ENABLED || 'false' }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          API_KEYVAULT_CLIENT_ID: ${{ vars.API_KEYVAULT_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          key_vault_args=(--set "keyVault.enabled=$KEY_VAULT_ENABLED")
          if [[ "$KEY_VAULT_ENABLED" = "true" ]]; then
            key_vault_args+=(
              --set-string "keyVault.name=$KEY_VAULT_NAME"
              --set-string "keyVault.tenantId=$AZURE_TENANT_ID"
              --set-string "keyVault.clientId=$API_KEYVAULT_CLIENT_ID"
            )
          fi

          helm upgrade --install "$RELEASE_NAME" \
            ./deploy/helm/platform-app \
            --namespace "$NAMESPACE" \
            --set-string api.image.repository="${{ needs.resolve-release.outputs.api_repository }}" \
            --set-string api.image.digest="${{ needs.resolve-release.outputs.api_digest }}" \
            --set-string frontend.image.repository="${{ needs.resolve-release.outputs.frontend_repository }}" \
            --set-string frontend.image.digest="${{ needs.resolve-release.outputs.frontend_digest }}" \
            --set-string nginx.image.repository="${{ needs.resolve-release.outputs.nginx_repository }}" \
            --set-string nginx.image.digest="${{ needs.resolve-release.outputs.nginx_digest }}" \
            --set-string release.commit="${{ needs.resolve-release.outputs.commit }}" \
            --set-string release.prNumber="${{ needs.resolve-release.outputs.pr_number }}" \
            --set-string release.workflowRunId="${{ inputs.release_run_id }}" \
            --set-string release.deploymentRunId="$GITHUB_RUN_ID" \
            --set minio.enabled=false \
            "${key_vault_args[@]}" \
            --wait --timeout 10m --history-max 20

      - name: Verify rollout, endpoints, and running image digests
        run: |
          bash scripts/verify-deployment.sh \
            "$NAMESPACE" \
            "${{ needs.resolve-release.outputs.api_digest }}" \
            "${{ needs.resolve-release.outputs.frontend_digest }}" \
            "${{ needs.resolve-release.outputs.nginx_digest }}" \
            false

      - name: Run internal application and dependency smoke tests
        run: |
          set -euo pipefail
          pod="smoke-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubectl run "$pod" \
            --namespace "$NAMESPACE" \
            --image=curlimages/curl:8.10.1 \
            --env="BASE_URL=${INTERNAL_SMOKE_URL%/}" \
            --restart=Never --rm --attach=true -- \
            sh -ceu '
              for path in /health /api/health /api/ready; do
                curl --fail --show-error --silent \
                  --retry 10 --retry-all-errors --retry-delay 3 \
                  "$BASE_URL$path" >/dev/null
              done
            '

      - name: Run public smoke test
        if: ${{ env.PUBLIC_SMOKE_TEST_URL != '' }}
        run: bash scripts/smoke-test.sh "$PUBLIC_SMOKE_TEST_URL"

      - name: Write successful deployment summary
        run: |
          {
            echo "## Production release verified"
            echo
            echo "- Pull request: #${{ needs.resolve-release.outputs.pr_number }}"
            echo "- Commit: \`${{ needs.resolve-release.outputs.commit }}\`"
            echo "- Build Release run: ${{ inputs.release_run_id }}"
            echo "- Deployment run: $GITHUB_RUN_ID"
            echo "- Namespace: $NAMESPACE"
            echo "- API digest: \`${{ needs.resolve-release.outputs.api_digest }}\`"
            echo "- Frontend digest: \`${{ needs.resolve-release.outputs.frontend_digest }}\`"
            echo "- Nginx digest: \`${{ needs.resolve-release.outputs.nginx_digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect failure diagnostics for human decision
        if: ${{ failure() }}
        run: |
          kubectl get deployments,statefulsets,pods,services,endpoints --namespace "$NAMESPACE" -o wide || true
          kubectl get events --namespace "$NAMESPACE" --sort-by=.lastTimestamp | tail -n 100 || true
          for workload in api frontend nginx; do
            kubectl logs "deployment/$workload" --namespace "$NAMESPACE" --tail=100 || true
          done
          {
            echo "## Deployment verification failed"
            echo
            echo "No automatic rollback was performed. Review diagnostics and choose rollback, recovery, roll-forward, or pause."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create deployment evidence
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          mkdir -p deployment-evidence
          running_images="$(kubectl get pods --namespace "$NAMESPACE" \
            -l 'app in (api,frontend,nginx)' \
            -o jsonpath='{range .items[*]}{.metadata.name}{"="}{range .status.containerStatuses[*]}{.imageID}{","}{end}{"\n"}{end}' \
            2>/dev/null || true)"
          jq -n \
            --arg status "$JOB_STATUS" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg deployment_run_id "$GITHUB_RUN_ID" \
            --arg deployment_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg release_run_id "${{ inputs.release_run_id }}" \
            --arg pr_number "${{ needs.resolve-release.outputs.pr_number }}" \
            --arg commit "${{ needs.resolve-release.outputs.commit }}" \
            --arg namespace "$NAMESPACE" \
            --arg identity "${{ vars.AZURE_DEPLOY_CLIENT_ID }}" \
            --arg running_images "$running_images" \
            --arg created_at "$(date --utc +%FT%TZ)" \
            '{
              schema_version: 1,
              status: $status,
              repository: $repository,
              deployment_run_id: ($deployment_run_id | tonumber),
              deployment_run_attempt: ($deployment_run_attempt | tonumber),
              release_run_id: ($release_run_id | tonumber),
              pull_request: ($pr_number | tonumber),
              commit: $commit,
              namespace: $namespace,
              workload_identity_client_id: $identity,
              running_images: $running_images,
              created_at: $created_at
            }' > deployment-evidence/deployment-result.json
          (cd deployment-evidence && sha256sum deployment-result.json > checksums.txt)

      - name: Publish deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence/
          if-no-files-found: error
          retention-days: 365

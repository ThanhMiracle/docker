name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Build Release run ID for the artifact being restored
        required: true
        type: string
      revision:
        description: Helm revision that deployed that artifact
        required: true
        type: string
      reason:
        description: Human decision rationale
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-platform-app
  cancel-in-progress: false

env:
  AKS_RG: ${{ vars.AKS_RESOURCE_GROUP }}
  AKS_NAME: ${{ vars.AKS_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  NAMESPACE: ${{ vars.K8S_NAMESPACE || 'platform' }}
  RELEASE_NAME: platform-app
  INTERNAL_SMOKE_URL: ${{ vars.INTERNAL_SMOKE_URL || 'http://nginx' }}
  PUBLIC_SMOKE_TEST_URL: ${{ vars.PROD_SMOKE_TEST_URL || '' }}

jobs:
  resolve-release:
    name: Validate rollback artifact
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.manifest.outputs.commit }}
      pr_number: ${{ steps.manifest.outputs.pr_number }}
      api_reference: ${{ steps.manifest.outputs.api_reference }}
      api_digest: ${{ steps.manifest.outputs.api_digest }}
      frontend_reference: ${{ steps.manifest.outputs.frontend_reference }}
      frontend_digest: ${{ steps.manifest.outputs.frontend_digest }}
      nginx_reference: ${{ steps.manifest.outputs.nginx_reference }}
      nginx_digest: ${{ steps.manifest.outputs.nginx_digest }}
    steps:
      - name: Validate rollback request
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          [[ "${{ inputs.release_run_id }}" =~ ^[1-9][0-9]*$ ]]
          [[ "${{ inputs.revision }}" =~ ^[1-9][0-9]*$ ]]
          test -n "$REASON"

      - name: Validate Build Release workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.release_run_id }}")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            '.name == "Build Release" and
             .path == ".github/workflows/release.yml" and
             .event == "push" and
             .head_branch == "master" and
             .conclusion == "success" and
             .repository.full_name == $repository' \
            <<< "$run_json" >/dev/null
          jq -r '.head_sha' <<< "$run_json" > "$RUNNER_TEMP/release-head-sha"

      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence
          path: release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Validate release evidence and extract artifact identity
        id: manifest
        run: |
          set -euo pipefail
          (cd release && sha256sum --check checksums.txt)
          manifest=release/release-manifest.json
          jq --exit-status '.schema_version == 2' "$manifest" >/dev/null
          test "$(jq -r '.workflow_run_id' "$manifest")" = "${{ inputs.release_run_id }}"

          commit="$(jq -er '.commit | select(test("^[a-f0-9]{40}$"))' "$manifest")"
          test "$commit" = "$(cat "$RUNNER_TEMP/release-head-sha")"
          pr_number="$(jq -er '.change.number | select(type == "number")' "$manifest")"

          for image in api frontend nginx; do
            repository="$(jq -er ".images.$image.repository" "$manifest")"
            digest="$(jq -er ".images.$image.digest | select(test(\"^sha256:[a-f0-9]{64}$\"))" "$manifest")"
            test -s "release/$(jq -er ".images.$image.sbom" "$manifest")"
            test -s "release/$(jq -er ".images.$image.provenance" "$manifest")"
            printf '%s_reference=%s@%s\n' "$image" "$repository" "$digest" >> "$GITHUB_OUTPUT"
            printf '%s_digest=%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
          done

          test "$(jq -r '.images.api.repository' "$manifest")" = "$ACR_LOGIN_SERVER/my-api"
          test "$(jq -r '.images.frontend.repository' "$manifest")" = "$ACR_LOGIN_SERVER/my-fe"
          test "$(jq -r '.images.nginx.repository' "$manifest")" = "$ACR_LOGIN_SERVER/my-nginx"
          printf 'commit=%s\npr_number=%s\n' "$commit" "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Write rollback approval context
        env:
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## Production rollback awaiting approval"
            echo
            echo "- Reason: $REASON"
            echo "- Target Helm revision: ${{ inputs.revision }}"
            echo "- Artifact release run: ${{ inputs.release_run_id }}"
            echo "- Original pull request: #${{ steps.manifest.outputs.pr_number }}"
            echo "- Commit: \`${{ steps.manifest.outputs.commit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Approved production rollback
    needs: resolve-release
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the artifact's release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0
      - name: Set up kubelogin
        uses: azure/use-kubelogin@76597ae0fcbaace21b05e13a2cbf8daee2c6e820 # v1
        with:
          kubelogin-version: v0.2.19

      - name: Validate production configuration
        run: |
          set -euo pipefail
          test -n "$AKS_RG"
          test -n "$AKS_NAME"
          test -n "$ACR_LOGIN_SERVER"

      - name: Sign in to Azure with the production OIDC identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$AKS_RG" --name "$AKS_NAME" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl get namespace "$NAMESPACE" >/dev/null

      - name: Verify selected revision contains the approved artifact
        run: |
          set -euo pipefail
          helm get manifest "$RELEASE_NAME" \
            --revision "${{ inputs.revision }}" \
            --namespace "$NAMESPACE" \
            > "$RUNNER_TEMP/rollback-manifest.yaml"
          grep --fixed-strings --quiet "${{ needs.resolve-release.outputs.api_reference }}" "$RUNNER_TEMP/rollback-manifest.yaml"
          grep --fixed-strings --quiet "${{ needs.resolve-release.outputs.frontend_reference }}" "$RUNNER_TEMP/rollback-manifest.yaml"
          grep --fixed-strings --quiet "${{ needs.resolve-release.outputs.nginx_reference }}" "$RUNNER_TEMP/rollback-manifest.yaml"

      - name: Roll back only the selected Helm revision
        run: |
          helm history "$RELEASE_NAME" --namespace "$NAMESPACE"
          helm rollback "$RELEASE_NAME" "${{ inputs.revision }}" \
            --namespace "$NAMESPACE" --wait --timeout 10m

      - name: Verify restored rollout, endpoints, and image digests
        run: |
          bash scripts/verify-deployment.sh \
            "$NAMESPACE" \
            "${{ needs.resolve-release.outputs.api_digest }}" \
            "${{ needs.resolve-release.outputs.frontend_digest }}" \
            "${{ needs.resolve-release.outputs.nginx_digest }}" \
            false

      - name: Run internal application and dependency smoke tests
        run: |
          set -euo pipefail
          pod="rollback-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubectl run "$pod" \
            --namespace "$NAMESPACE" \
            --image=curlimages/curl:8.10.1 \
            --env="BASE_URL=${INTERNAL_SMOKE_URL%/}" \
            --restart=Never --rm --attach=true -- \
            sh -ceu '
              for path in /health /api/health /api/ready; do
                curl --fail --show-error --silent \
                  --retry 10 --retry-all-errors --retry-delay 3 \
                  "$BASE_URL$path" >/dev/null
              done
            '

      - name: Run public smoke test
        if: ${{ env.PUBLIC_SMOKE_TEST_URL != '' }}
        run: bash scripts/smoke-test.sh "$PUBLIC_SMOKE_TEST_URL"

      - name: Write successful rollback summary
        env:
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## Production rollback verified"
            echo
            echo "- Reason: $REASON"
            echo "- Restored Helm revision: ${{ inputs.revision }}"
            echo "- Artifact release run: ${{ inputs.release_run_id }}"
            echo "- Original pull request: #${{ needs.resolve-release.outputs.pr_number }}"
            echo "- Commit: \`${{ needs.resolve-release.outputs.commit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect failure diagnostics for human decision
        if: ${{ failure() }}
        run: |
          kubectl get deployments,statefulsets,pods,services,endpoints --namespace "$NAMESPACE" -o wide || true
          kubectl get events --namespace "$NAMESPACE" --sort-by=.lastTimestamp | tail -n 100 || true

      - name: Create rollback evidence
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          REASON: ${{ inputs.reason }}
        run: |
          mkdir -p rollback-evidence
          jq -n \
            --arg status "$JOB_STATUS" \
            --arg reason "$REASON" \
            --arg rollback_run_id "$GITHUB_RUN_ID" \
            --arg release_run_id "${{ inputs.release_run_id }}" \
            --arg revision "${{ inputs.revision }}" \
            --arg pr_number "${{ needs.resolve-release.outputs.pr_number }}" \
            --arg commit "${{ needs.resolve-release.outputs.commit }}" \
            --arg created_at "$(date --utc +%FT%TZ)" \
            '{
              schema_version: 1,
              status: $status,
              reason: $reason,
              rollback_run_id: ($rollback_run_id | tonumber),
              release_run_id: ($release_run_id | tonumber),
              helm_revision: ($revision | tonumber),
              pull_request: ($pr_number | tonumber),
              commit: $commit,
              created_at: $created_at
            }' > rollback-evidence/rollback-result.json
          (cd rollback-evidence && sha256sum rollback-result.json > checksums.txt)

      - name: Publish rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback-evidence/
          if-no-files-found: error
          retention-days: 365

name: Deploy Container Apps

# Run only after Build Release completes on master.
on:
  workflow_run:
    workflows: ["Build Release"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

# Never deploy two production releases at the same time.
concurrency:
  group: deploy-container-apps-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend and frontend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      RESOURCE_GROUP: ${{ vars.CONTAINER_APPS_RESOURCE_GROUP || 'ThanhDT03-Lab' }}
      BACKEND_APP: ${{ vars.BACKEND_CONTAINER_APP || 'myapp-prod-be' }}
      FRONTEND_APP: ${{ vars.FRONTEND_CONTAINER_APP || 'myapp-prod-fe' }}
      BACKEND_CONTAINER: ${{ vars.BACKEND_CONTAINER_NAME || 'backend' }}
      FRONTEND_CONTAINER: ${{ vars.FRONTEND_CONTAINER_NAME || 'frontend' }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      BUILD_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

    steps:
      - name: Download release evidence from successful build
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate manifest and extract immutable image references
        id: images
        run: |
          set -euo pipefail

          test -n "$ACR_LOGIN_SERVER"
          test -f release/release-manifest.json
          test -f release/checksums.txt
          (cd release && sha256sum --check checksums.txt)

          # Require the checksum file to list the release manifest itself.
          manifest_checksum="$(awk '$2 == "release-manifest.json" { print $1 }' release/checksums.txt)"
          test -n "$manifest_checksum"
          test "$(sha256sum release/release-manifest.json | cut -d ' ' -f 1)" = "$manifest_checksum"

          # Bind both image digests to the exact successful upstream build.
          jq -e \
            --arg sha "$BUILD_COMMIT" \
            --argjson run_id "$BUILD_RUN_ID" \
            --argjson attempt "$BUILD_RUN_ATTEMPT" \
            --arg backend_repo "$ACR_LOGIN_SERVER/my-api" \
            --arg frontend_repo "$ACR_LOGIN_SERVER/my-fe" \
            '
              .schema_version == 1 and
              .commit == $sha and
              .workflow_run_id == $run_id and
              .workflow_run_attempt == $attempt and
              .images.api.repository == $backend_repo and
              .images.frontend.repository == $frontend_repo and
              (.images.api.digest | test("^sha256:[a-f0-9]{64}$")) and
              (.images.frontend.digest | test("^sha256:[a-f0-9]{64}$"))
            ' release/release-manifest.json > /dev/null

          backend_digest="$(jq -r '.images.api.digest' release/release-manifest.json)"
          frontend_digest="$(jq -r '.images.frontend.digest' release/release-manifest.json)"

          printf 'backend_image=%s/my-api@%s\n' "$ACR_LOGIN_SERVER" "$backend_digest" >> "$GITHUB_OUTPUT"
          printf 'frontend_image=%s/my-fe@%s\n' "$ACR_LOGIN_SERVER" "$frontend_digest" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure with deployment OIDC identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check Container Apps, ACR configuration, and network accessibility
        id: apps
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors

          check_app() {
            local app="$1" container="$2" port="$3" output="$4"
            local app_json environment_id environment_json
            local ingress_external environment_internal public_network_access
            local fqdn url=""

            app_json="$(az containerapp show \
              --name "$app" --resource-group "$RESOURCE_GROUP" \
              --output json --only-show-errors)"

            # Only change the image; keep the configured ingress, pull identity,
            # secrets, ports and single-revision traffic policy intact.
            jq -e --arg container "$container" --arg registry "$ACR_LOGIN_SERVER" --argjson port "$port" '
              .properties.configuration.activeRevisionsMode == "Single" and
              .properties.configuration.ingress.targetPort == $port and
              ([.properties.template.containers[] | select(.name == $container)] | length == 1) and
              any(.properties.configuration.registries[]?;
                .server == $registry and
                ((.identity // "") != "" or
                 ((.username // "") != "" and (.passwordSecretRef // "") != "")))
            ' <<< "$app_json" > /dev/null || {
              echo "::error::$app requires container $container, port $port, Single revision mode, and an ACR pull identity or credentials for $ACR_LOGIN_SERVER."
              exit 1
            }

            # An app can have external ingress while its ENVIRONMENT is internal.
            # Such an FQDN is private and cannot be probed by GitHub-hosted runners.
            environment_id="$(jq -er '
              (.properties.managedEnvironmentId // .properties.environmentId)
              | select(type == "string" and length > 0)
            ' <<< "$app_json")"

            environment_json="$(az containerapp env show \
              --ids "$environment_id" --output json --only-show-errors)"

            environment_internal="$(jq -r '.properties.vnetConfiguration.internal // false' <<< "$environment_json")"
            public_network_access="$(jq -r '.properties.publicNetworkAccess // "Enabled"' <<< "$environment_json")"
            ingress_external="$(jq -r '.properties.configuration.ingress.external // false' <<< "$app_json")"

            if [[ "$environment_internal" == "true" ]]; then
              echo "::notice::$app is in an internal Container Apps environment; skipping public HTTP smoke tests."
            elif [[ "$public_network_access" == "Disabled" ]]; then
              echo "::notice::$app has public network access disabled; skipping public HTTP smoke tests."
            elif [[ "$ingress_external" != "true" ]]; then
              echo "::notice::$app uses app-internal ingress; skipping public HTTP smoke tests."
            else
              fqdn="$(jq -er '
                .properties.configuration.ingress.fqdn
                | select(type == "string" and length > 0)
              ' <<< "$app_json")"
              url="https://$fqdn"
              echo "Public smoke test is enabled for $app: $url"
            fi

            # Empty URL signals that only Azure revision readiness is tested.
            printf '%s_url=%s\n' "$output" "$url" >> "$GITHUB_OUTPUT"
          }

          check_app "$BACKEND_APP" "$BACKEND_CONTAINER" 8000 backend
          check_app "$FRONTEND_APP" "$FRONTEND_CONTAINER" 8080 frontend

      - name: Deploy and verify backend, then frontend
        id: deploy
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          BACKEND_URL: ${{ steps.apps.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.apps.outputs.frontend_url }}
        run: |
          set -euo pipefail

          deploy_app() {
            local app="$1" container="$2" image="$3" output="$4" url="$5"
            local suffix="gh${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            local revision revision_json app_json state
            local -a paths

            revision="$(az containerapp update \
              --name "$app" --resource-group "$RESOURCE_GROUP" \
              --container-name "$container" --image "$image" \
              --revision-suffix "$suffix" \
              --query properties.latestRevisionName --output tsv --only-show-errors)"

            if [[ "$revision" != "$app--$suffix" ]]; then
              echo "::error::Unexpected revision for $app: $revision"
              exit 1
            fi

            printf '%s_revision=%s\n' "$output" "$revision" >> "$GITHUB_OUTPUT"

            # Verify the new image, healthy revision, and ready traffic target.
            for attempt in {1..60}; do
              revision_json="$(az containerapp revision show \
                --name "$app" --resource-group "$RESOURCE_GROUP" \
                --revision "$revision" --output json --only-show-errors)"
              app_json="$(az containerapp show \
                --name "$app" --resource-group "$RESOURCE_GROUP" \
                --output json --only-show-errors)"

              if jq -e --arg container "$container" --arg image "$image" '
                .properties.active == true and
                .properties.provisioningState == "Provisioned" and
                .properties.healthState == "Healthy" and
                any(.properties.template.containers[]; .name == $container and .image == $image)
              ' <<< "$revision_json" > /dev/null &&
                [[ "$(jq -r '.properties.latestReadyRevisionName' <<< "$app_json")" == "$revision" ]]; then
                echo "$app is serving verified revision $revision."
                break
              fi

              state="$(jq -r '.properties.provisioningState' <<< "$revision_json")"
              if [[ "$state" == "Failed" || "$state" == "ProvisioningFailed" || "$attempt" == 60 ]]; then
                echo "::error::$app revision $revision failed to become healthy and ready (state: $state)."
                exit 1
              fi

              echo "Waiting for $app revision $revision ($attempt/60)..."
              sleep 10
            done

            if [[ -z "$url" ]]; then
              echo "::notice::$app revision is healthy; private HTTP smoke test skipped."
              return 0
            fi

            # Public HTTP checks only if the app AND environment allow them.
            # Backend health endpoints are /health and /ready (not /api/health).
            if [[ "$output" == "backend" ]]; then
              paths=(/health /ready)
            else
              paths=(/ /env.js)
            fi

            for path in "${paths[@]}"; do
              curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --retry 5 --retry-delay 10 --retry-all-errors \
                --output /dev/null "$url$path"
              echo "Smoke test passed: $app $path"
            done
          }

          # Image-only updates preserve each app's secrets, managed identity and settings.
          deploy_app "$BACKEND_APP" "$BACKEND_CONTAINER" "$BACKEND_IMAGE" backend "$BACKEND_URL"
          deploy_app "$FRONTEND_APP" "$FRONTEND_CONTAINER" "$FRONTEND_IMAGE" frontend "$FRONTEND_URL"

      - name: Collect revision diagnostics on failure
        if: failure()
        run: |
          for app in "$BACKEND_APP" "$FRONTEND_APP"; do
            echo "Revisions for $app:"
            az containerapp revision list \
              --name "$app" --resource-group "$RESOURCE_GROUP" \
              --query '[].{revision:name,active:properties.active,provisioning:properties.provisioningState,health:properties.healthState,running:properties.runningState}' \
              --output table --only-show-errors || true
          done

      - name: Publish deployment summary
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          BACKEND_REVISION: ${{ steps.deploy.outputs.backend_revision }}
          FRONTEND_REVISION: ${{ steps.deploy.outputs.frontend_revision }}
        run: |
          {
            echo "## Container Apps deployment: $DEPLOY_STATUS"
            echo
            echo "- Build Release: $BUILD_RUN_ID (attempt $BUILD_RUN_ATTEMPT)"
            echo "- Commit: $BUILD_COMMIT"
            echo "- Backend: $BACKEND_APP / $BACKEND_REVISION"
            echo "- Backend image: $BACKEND_IMAGE"
            echo "- Frontend: $FRONTEND_APP / $FRONTEND_REVISION"
            echo "- Frontend image: $FRONTEND_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

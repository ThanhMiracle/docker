name: Deploy Container Apps

# Run only after Build Release completes on master.
on:
  workflow_run:
    workflows: ["Build Release"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

# Never deploy two production releases at the same time.
concurrency:
  group: deploy-container-apps-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend and frontend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      RESOURCE_GROUP: ${{ vars.CONTAINER_APPS_RESOURCE_GROUP || 'ThanhDT03-Lab' }}
      BACKEND_APP: ${{ vars.BACKEND_CONTAINER_APP || 'myapp-prod-be' }}
      FRONTEND_APP: ${{ vars.FRONTEND_CONTAINER_APP || 'myapp-prod-fe' }}
      BACKEND_CONTAINER: ${{ vars.BACKEND_CONTAINER_NAME || 'backend' }}
      FRONTEND_CONTAINER: ${{ vars.FRONTEND_CONTAINER_NAME || 'frontend' }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      BUILD_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

    steps:
      - name: Checkout pipeline scripts
        uses: actions/checkout@v6

      - name: Download release evidence from successful build
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate manifest and extract immutable image references
        id: images
        run: |
          set -euo pipefail

          test -n "$ACR_LOGIN_SERVER"
          test -f release/release-manifest.json
          test -f release/checksums.txt
          (cd release && sha256sum --check checksums.txt)

          # Require the checksum file to list the release manifest itself.
          manifest_checksum="$(awk '$2 == "release-manifest.json" { print $1 }' release/checksums.txt)"
          test -n "$manifest_checksum"
          test "$(sha256sum release/release-manifest.json | cut -d ' ' -f 1)" = "$manifest_checksum"

          # Bind both image digests to the exact successful upstream build.
          jq -e \
            --arg sha "$BUILD_COMMIT" \
            --argjson run_id "$BUILD_RUN_ID" \
            --argjson attempt "$BUILD_RUN_ATTEMPT" \
            --arg backend_repo "$ACR_LOGIN_SERVER/my-api" \
            --arg frontend_repo "$ACR_LOGIN_SERVER/my-fe" \
            '
              .schema_version == 1 and
              .commit == $sha and
              .workflow_run_id == $run_id and
              .workflow_run_attempt == $attempt and
              .images.api.repository == $backend_repo and
              .images.frontend.repository == $frontend_repo and
              (.images.api.digest | test("^sha256:[a-f0-9]{64}$")) and
              (.images.frontend.digest | test("^sha256:[a-f0-9]{64}$"))
            ' release/release-manifest.json > /dev/null

          backend_digest="$(jq -r '.images.api.digest' release/release-manifest.json)"
          frontend_digest="$(jq -r '.images.frontend.digest' release/release-manifest.json)"

          printf 'backend_image=%s/my-api@%s\n' "$ACR_LOGIN_SERVER" "$backend_digest" >> "$GITHUB_OUTPUT"
          printf 'frontend_image=%s/my-fe@%s\n' "$ACR_LOGIN_SERVER" "$frontend_digest" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure with deployment OIDC identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check Container Apps, ACR configuration, and network accessibility
        id: apps
        run: bash scripts/check-container-apps.sh

      - name: Deploy and verify backend, then frontend
        id: deploy
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          BACKEND_URL: ${{ steps.apps.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.apps.outputs.frontend_url }}
          FRONTEND_API_BASE: ${{ vars.CONTAINER_APPS_API_BASE || '/api' }}
        run: bash scripts/deploy-container-apps.sh

      - name: Collect revision diagnostics on failure
        if: failure()
        run: |
          for app in "$BACKEND_APP" "$FRONTEND_APP"; do
            echo "Revisions for $app:"
            az containerapp revision list \
              --name "$app" --resource-group "$RESOURCE_GROUP" \
              --query '[].{revision:name,active:properties.active,provisioning:properties.provisioningState,health:properties.healthState,running:properties.runningState}' \
              --output table --only-show-errors || true
          done

      - name: Publish deployment summary
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          BACKEND_REVISION: ${{ steps.deploy.outputs.backend_revision }}
          FRONTEND_REVISION: ${{ steps.deploy.outputs.frontend_revision }}
        run: |
          {
            echo "## Container Apps deployment: $DEPLOY_STATUS"
            echo
            echo "- Build Release: $BUILD_RUN_ID (attempt $BUILD_RUN_ATTEMPT)"
            echo "- Commit: $BUILD_COMMIT"
            echo "- Backend: $BACKEND_APP / $BACKEND_REVISION"
            echo "- Backend image: $BACKEND_IMAGE"
            echo "- Frontend: $FRONTEND_APP / $FRONTEND_REVISION"
            echo "- Frontend image: $FRONTEND_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

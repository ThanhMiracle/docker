name: PR CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  deployment-test:
    name: Deployment workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Check shell syntax and deployment safety
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python -m unittest discover -s scripts/tests -v

  backend-test:
    name: Backend tests and coverage with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: application_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U ci -d application_test'
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: platform-api-test:${{ github.sha }}
      - name: Run application tests against real PostgreSQL
        env:
          # Isolated disposable CI database; never use production credentials.
          TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@127.0.0.1:5432/application_test
        run: |
          mkdir -p reports/backend
          chmod 777 reports/backend
          docker run --rm --network host \
            -e DATABASE_URL="$TEST_DATABASE_URL" \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_EMAIL=alice@example.com \
            -v "$PWD/reports/backend:/reports" \
            platform-api-test:${{ github.sha }} \
            pytest -q -p no:cacheprovider /app/tests \
              --cov=app --cov-report=term-missing \
              --cov-report=xml:/reports/coverage.xml \
              --junitxml=/reports/junit.xml --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: reports/backend/
          if-no-files-found: warn
          retention-days: 90

  frontend-build:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Enforce dependency security gate
        run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Build frontend and gateway runtime images
        run: |
          docker build --tag platform-frontend:ci frontend
          docker build --tag platform-nginx:ci nginx

  sast:
    name: Backend SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check bandit==1.8.6
      - name: Enforce SAST gate
        run: |
          mkdir -p reports
          bandit -r backend/app --severity-level medium --confidence-level medium \
            --format json --output reports/bandit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-evidence
          path: reports/
          retention-days: 90

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan application source and dependencies
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          scanners: vuln
          skip-dirs: tmp,.git
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: json
          output: source-security.json
      - name: Reject committed secrets at every severity
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          skip-dirs: tmp,.git
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true
          format: json
          output: source-secrets.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-security-evidence
          path: |
            source-security.json
            source-secrets.json
          retention-days: 90

  policy:
    name: Application deployment policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Render and validate development and production configuration
        run: |
          helm lint deploy/helm/platform-app -f deploy/helm/platform-app/values-dev.yml
          digest="sha256:$(printf 'a%.0s' {1..64})"
          args=(--set-string "api.image.digest=$digest" \
            --set-string "frontend.image.digest=$digest" \
            --set-string "nginx.image.digest=$digest" \
            -f deploy/helm/platform-app/values-prod.yml)
          helm lint deploy/helm/platform-app "${args[@]}"
          helm template platform-app deploy/helm/platform-app \
            --namespace platform "${args[@]}" > rendered-manifests.yaml
          archive="$RUNNER_TEMP/conftest.tar.gz"
          curl -fsSL -o "$archive" \
            https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz
          echo "af879740a9b43aae21f928ed5d3571615c9d17b5d0551623a56d317812db0f98  $archive" | sha256sum --check
          tar -xzf "$archive" -C /usr/local/bin conftest
          conftest test --policy policy rendered-manifests.yaml

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [deployment-test, backend-test, frontend-build, sast, security, policy]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

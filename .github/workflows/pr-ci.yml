name: PR CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend test image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: platform-api-test:${{ github.sha }}

      - name: Run unit and integration tests
        run: >-
          docker run --rm
          -e DATABASE_URL=sqlite:////tmp/platform-app-test.db
          -e ADMIN_EMAIL=alice@example.com
          platform-api-test:${{ github.sha }}


  # =========================================================
  # Frontend Build
  # =========================================================
  frontend-build:
    name: Frontend and container builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build runtime images
        run: |
          docker build \
            --file frontend/Dockerfile \
            --tag platform-frontend:pr \
            frontend

          docker build \
            --file nginx/Dockerfile \
            --tag platform-nginx:pr \
            nginx


  # =========================================================
  # SAST
  # =========================================================
  sast:
    name: Backend SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Bandit
        run: |
          python -m pip install \
            --disable-pip-version-check \
            bandit==1.8.6

          bandit \
            --recursive backend/app \
            --severity-level medium \
            --confidence-level medium


  # =========================================================
  # Security Scan
  # =========================================================
  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Enable this later if you want dedicated secret scanning
      #
      # - name: Detect committed secrets
      #   uses: gitleaks/gitleaks-action@v2
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan source, dependencies, and IaC
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          skip-dirs: deploy/helm/platform-app
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true


  # =========================================================
  # Helm / Kubernetes Policy
  # =========================================================
  policy:
    name: Helm and deployment policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Lint development values
        run: |
          helm lint \
            ./deploy/helm/platform-app \
            --values ./deploy/helm/platform-app/values-dev.yml

      - name: Render production manifests with immutable test digests
        run: |
          digest="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

          helm template platform-app \
            ./deploy/helm/platform-app \
            --namespace platform \
            --set-string api.image.digest="$digest" \
            --set-string frontend.image.digest="$digest" \
            --set-string nginx.image.digest="$digest" \
            > rendered-manifests.yaml

      - name: Install Conftest
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz \
            | tar \
                --extract \
                --gzip \
                --directory /usr/local/bin \
                conftest

      - name: Enforce immutable-image policy
        run: |
          conftest test \
            --policy policy \
            rendered-manifests.yaml


  # =========================================================
  # Final Quality Gate
  # =========================================================
  quality-gate:
    name: Quality Gate
    if: always()

    needs:
      - backend-test
      - frontend-build
      - sast
      - security
      - policy

    runs-on: ubuntu-latest

    steps:
      - name: Enforce all required checks
        env:
          BACKEND: ${{ needs.backend-test.result }}
          FRONTEND: ${{ needs.frontend-build.result }}
          SAST: ${{ needs.sast.result }}
          SECURITY: ${{ needs.security.result }}
          POLICY: ${{ needs.policy.result }}

        run: |
          echo "Backend:  $BACKEND"
          echo "Frontend: $FRONTEND"
          echo "SAST:     $SAST"
          echo "Security: $SECURITY"
          echo "Policy:   $POLICY"

          for result in \
            "$BACKEND" \
            "$FRONTEND" \
            "$SAST" \
            "$SECURITY" \
            "$POLICY"
          do
            if [ "$result" != "success" ]; then
              echo "::error::One or more required CI checks failed."
              exit 1
            fi
          done

          echo "All CI quality gates passed."
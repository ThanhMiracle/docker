name: PR CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  change-record:
    name: Validate PR change record
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the production change fields
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          test -n "$PR_TITLE" || { echo "::error::Pull request title is required."; exit 1; }
          test -n "$PR_BODY" || { echo "::error::Pull request body is required."; exit 1; }

          for field in \
            "Business reason" \
            "Risk level" \
            "Owner" \
            "Scope" \
            "Rollout/verification" \
            "Rollback or recovery plan"
          do
            value="$(sed -n -E "s/^- ${field}:[[:space:]]*(.+)$/\\1/p" <<< "$PR_BODY" | head -n1)"
            test -n "$value" || {
              echo "::error::PR field '${field}' must have a value."
              exit 1
            }
          done

  backend-test:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build backend test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: platform-api-test:${{ github.sha }}
      - name: Run unit and integration tests with coverage gate
        run: |
          mkdir -p test-results
          chmod 0777 test-results
          docker run --rm \
            -e DATABASE_URL=sqlite:////tmp/platform-app-test.db \
            -e ADMIN_EMAIL=alice@example.com \
            -v "$PWD/test-results:/test-results" \
            platform-api-test:${{ github.sha }} \
            pytest -q -p no:cacheprovider /app/tests \
              --cov=app \
              --cov-report=term-missing \
              --cov-report=xml:/test-results/coverage.xml \
              --cov-fail-under=70
      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ github.event.pull_request.number }}
          path: test-results/coverage.xml
          if-no-files-found: warn
          retention-days: 30

  frontend-build:
    name: Frontend and container builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build runtime images
        run: |
          docker build --file frontend/Dockerfile --tag platform-frontend:pr frontend
          docker build --file nginx/Dockerfile --tag platform-nginx:pr nginx

  sast:
    name: Backend SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Run Bandit
        run: |
          python -m pip install --disable-pip-version-check bandit==1.8.6
          bandit --recursive backend/app --severity-level medium --confidence-level medium

  security:
    name: Secret, dependency, and configuration scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan source, dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  policy:
    name: Helm and deployment policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0
      - name: Render production manifests
        run: |
          set -euo pipefail
          digest="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          helm lint ./deploy/helm/platform-app --values ./deploy/helm/platform-app/values-dev.yml
          helm template platform-app ./deploy/helm/platform-app \
            --namespace platform \
            --set-string api.image.digest="$digest" \
            --set-string frontend.image.digest="$digest" \
            --set-string nginx.image.digest="$digest" \
            > rendered-manifests.yaml
      - name: Install verified Conftest
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/conftest.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz
          echo "af879740a9b43aae21f928ed5d3571615c9d17b5d0551623a56d317812db0f98  $archive" \
            | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /usr/local/bin conftest
      - name: Enforce immutable-image policy
        run: conftest test --policy policy rendered-manifests.yaml

  quality-gate:
    name: Quality Gate
    if: ${{ always() && !github.event.pull_request.draft }}
    needs:
      - change-record
      - backend-test
      - frontend-build
      - sast
      - security
      - policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all required checks
        env:
          CHANGE_RECORD: ${{ needs.change-record.result }}
          BACKEND: ${{ needs.backend-test.result }}
          FRONTEND: ${{ needs.frontend-build.result }}
          SAST: ${{ needs.sast.result }}
          SECURITY: ${{ needs.security.result }}
          POLICY: ${{ needs.policy.result }}
        run: |
          set -euo pipefail
          for result in "$CHANGE_RECORD" "$BACKEND" "$FRONTEND" "$SAST" "$SECURITY" "$POLICY"
          do
            test "$result" = "success" || {
              echo "::error::One or more required CI checks failed."
              exit 1
            }
          done
          echo "All PR quality gates passed."

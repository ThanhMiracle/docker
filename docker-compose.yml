services:
  api:
    image: my-api:local
    build:
      context: ./backend
      target: runtime
    container_name: backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mydb
      - JWT_SECRET=change-me-please
      - JWT_EXPIRE_MINUTES=120
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - STORAGE_BACKEND=minio
      - MINIO_BUCKET=${MINIO_BUCKET:-uploads}
      # Browser-facing URL. Nginx proxies this path to the local MinIO service.
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost/uploads}
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_AUTO_CREATE_BUCKET=true
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on: [db, minio]
    networks:
      - appnet

  frontend:
    image: my-fe:local
    build: ./frontend
    container_name: frontend
    environment:
      # Use the local reverse proxy so browser requests follow the same path
      # they use in production.
      - API_BASE=/api
  

    depends_on: [api]
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    container_name: proxy
    depends_on: [frontend, api]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - appnet

  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - appnet

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9008:9000"
      - "9001:9001"
    networks:
      - appnet

volumes:
  db_data:
  minio_data:

networks:
  appnet:
    driver: bridge

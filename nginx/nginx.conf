# /etc/nginx/nginx.conf
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Log cơ bản
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  # Tăng giới hạn upload nếu cần
  client_max_body_size 50m;

  # Upstreams trong docker network
  upstream frontend_upstream {
    server frontend:8080;
    keepalive 16;
  }

  upstream api_upstream {
    server api:8000;
    keepalive 16;
  }

  upstream minio_upstream {
    server minio:9000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    # -------------------------
    # FRONTEND (SPA)
    # -------------------------
    # Local development object storage. This makes image URLs work in the
    # browser without exposing Docker service names such as "minio" or "w".
    location /uploads/ {
      proxy_pass http://minio_upstream/uploads/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # BACKEND (FastAPI)
    # -------------------------
    location = /api/chat/ws {
      proxy_pass http://api_upstream/chat/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

  }
}

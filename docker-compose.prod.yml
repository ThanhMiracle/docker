networks:
  appnet:
    driver: bridge

services:
  # Reverse proxy - cổng public duy nhất
  nginx:
    image: nginx:alpine
    container_name: proxy
    depends_on:
      - frontend
      - api
    ports:
      - "80:80" # Your Azure HTTPS gateway/proxy forwards traffic to this port.
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [appnet]

  # Frontend SPA (đang dùng image có sẵn của bạn)
  frontend:
    image: ${FRONTEND_IMAGE:-thanh2909/my-frontend}:${IMAGE_TAG:-latest}
    container_name: frontend
    environment:
      - API_BASE=${API_BASE}
    networks: [appnet]
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy

  # Backend FastAPI
  api:
    image: ${API_IMAGE:-thanh2909/my-api}:${IMAGE_TAG:-latest}
    container_name: api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-5}
      - LOGIN_RATE_WINDOW_SECONDS=${LOGIN_RATE_WINDOW_SECONDS:-60}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - STORAGE_BACKEND=azure
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER}
      - AZURE_BLOB_PUBLIC_URL=${AZURE_BLOB_PUBLIC_URL:-}
    networks: [appnet]
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Sends a Slack-compatible webhook alert only when health changes state.
  health-monitor:
    image: curlimages/curl:8.10.1
    container_name: health-monitor
    command: ["sh", "/monitor/health-monitor.sh"]
    environment:
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - HEALTHCHECK_INTERVAL_SECONDS=${HEALTHCHECK_INTERVAL_SECONDS:-60}
    volumes:
      - ./scripts/health-monitor.sh:/monitor/health-monitor.sh:ro
    depends_on:
      nginx:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    networks: [appnet]

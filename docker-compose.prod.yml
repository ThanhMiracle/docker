networks:
  appnet:
    driver: bridge

services:
  # Reverse proxy - cổng public duy nhất
  nginx:
    image: nginx:alpine
    container_name: proxy
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"        # Mở port 80 ra Internet
      # Nếu muốn HTTPS bằng reverse proxy khác/certbot thì thêm 443 ở đây
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks: [appnet]

  # Frontend SPA (đang dùng image có sẵn của bạn)
  frontend:
    image: thanh2909/my-frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    environment:
      - API_BASE=${API_BASE}
    networks: [appnet]
    restart: unless-stopped
    depends_on:
      - api

  # Backend FastAPI
  api:
    image: thanh2909/my-api:${IMAGE_TAG:-latest}
    container_name: api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES}
      - STORAGE_BACKEND=azure
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER}
      - AZURE_BLOB_PUBLIC_URL=${AZURE_BLOB_PUBLIC_URL:-}
    networks: [appnet]
    restart: unless-stopped

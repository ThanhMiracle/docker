sonar.projectKey=docker-shop
sonar.projectName=Docker Shop
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**

# Block the Jenkins pipeline until SonarQube computes the quality gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
